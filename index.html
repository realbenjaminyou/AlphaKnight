            if score > best_score:
                best_score = score
                best_move = move
            if score > alpha:
                alpha = score
            if alpha >= beta:
                self.tt.store(
                    self.position.hash_key, depth, beta, TT_LOWER, best_move, static_eval, 0
                )
                return beta, best_move

        flag = TT_EXACT if alpha > original_alpha else TT_UPPER
        self.tt.store(self.position.hash_key, depth, alpha, flag, best_move, static_eval, 0)
        return alpha, best_move

    def _search(
        self,
        depth: int,
        alpha: int,
        beta: int,
        ply: int,
        pv_node: bool,
        allow_null: bool,
        previous_move: int,
    ) -> int:
        self.nodes += 1
        self._check_time()
        if ply >= MAX_PLY - 2:
            return self.position.evaluate()
        if self.position.halfmove >= 100 or self.position.insufficient_material():
            return 0
        if self._is_repetition(ply):
            return 0

        in_check = self.position.in_check()
        if depth <= 0:
            return self._quiescence(alpha, beta, ply, 0)
        if in_check and depth <= 8:
            depth += 1

        alpha = max(alpha, -MATE + ply)
        beta = min(beta, MATE - ply - 1)
        if alpha >= beta:
            return alpha
        original_alpha = alpha
        key = self.position.hash_key
        tt_entry = self.tt.probe(key, ply)
        tt_move = 0
        static_eval = INF
        if tt_entry is not None:
            tt_depth, tt_score, tt_flag, tt_move, tt_eval = tt_entry
            static_eval = tt_eval
            if tt_depth >= depth and not pv_node:
                if tt_flag == TT_EXACT:
                    return tt_score
                if tt_flag == TT_LOWER and tt_score >= beta:
                    return beta
                if tt_flag == TT_UPPER and tt_score <= alpha:
                    return alpha

        if in_check:
            static_eval = -INF
        elif static_eval == INF:
            static_eval = self.position.evaluate()

        if not pv_node and not in_check and depth <= 6 and static_eval < MATE_THRESHOLD:
            margin = 85 * depth + 35 * depth * depth
            if static_eval - margin >= beta:
                return beta

        if (
            allow_null
            and not pv_node
            and not in_check
            and depth >= 3
            and static_eval >= beta
            and self.position.has_non_pawn_material(self.position.side)
            and abs(beta) < MATE_THRESHOLD
        ):
            reduction = 2 + int(depth >= 6 or static_eval - beta >= 180)
            null_undo = self.position.make_null()
            self.path_keys[ply + 1] = self.position.hash_key
            null_score = -self._search(
                max(0, depth - 1 - reduction), -beta, -beta + 1, ply + 1, False, False, 0
            )
            self.position.unmake_null(null_undo)
            if null_score >= beta:
                if depth < 8:
                    return beta
                verify = self._search(
                    depth - 1 - reduction,
                    beta - 1,
                    beta,
                    ply,
                    False,
                    False,
                    previous_move,
                )
                if verify >= beta:
                    return beta

        if tt_move == 0 and not in_check and depth >= (7 if pv_node else 5):
            depth -= 1

        moves = self.position.generate_moves()
        if not moves:
            return -MATE + ply if in_check else 0
        ordered = self._order_moves(moves, tt_move, ply, previous_move)
        best_move = 0
        best_score = -INF
        legal_count = 0
        quiets_searched: list[int] = []
        killer_one = self.killers[ply][0]
        killer_two = self.killers[ply][1]

        for move in ordered:
            captured = (move >> 15) & 7
            promotion = (move >> 18) & 7
            quiet = captured == NO_CAPTURE and promotion == PROMO_NONE
            gives_check = self.position.gives_check_fast(move)
            if (
                not pv_node
                and not in_check
                and depth <= 2
                and legal_count >= 2
                and quiet
                and not gives_check
                and move != tt_move
                and move not in (killer_one, killer_two)
            ):
                futility_margin = 95 + 105 * depth
                move_bonus = max(0, self.position.positional_move_bonus(move))
                if static_eval + futility_margin + move_bonus <= alpha:
                    continue

            undo = self.position.make_move(move)
            if undo is None:
                continue
            legal_count += 1
            self.path_keys[ply + 1] = self.position.hash_key
            child_depth = depth - 1
            score: int
            if legal_count == 1:
                score = -self._search(child_depth, -beta, -alpha, ply + 1, pv_node, True, move)
            else:
                reduction = 0
                if quiet and depth >= 3 and legal_count >= 3 and not in_check and not gives_check:
                    reduction = LMR_TABLE[min(64, depth)][min(64, legal_count)]
                    history_score = self.history[self.position.side ^ 1][move & 63][
                        (move >> 6) & 63
                    ]
                    if move in (killer_one, killer_two):
                        reduction = max(0, reduction - 1)
                    if history_score > 900:
                        reduction = max(0, reduction - 1)
                    elif history_score < -900:
                        reduction += 1
                    if pv_node:
                        reduction = max(0, reduction - 1)
                    reduction = min(reduction, max(0, child_depth - 1))
                if reduction:
                    score = -self._search(
                        child_depth - reduction, -alpha - 1, -alpha, ply + 1, False, True, move
                    )
                else:
                    score = alpha + 1
                if score > alpha:
                    score = -self._search(
                        child_depth, -alpha - 1, -alpha, ply + 1, False, True, move
                    )
                    if pv_node and alpha < score < beta:
                        score = -self._search(child_depth, -beta, -alpha, ply + 1, True, True, move)
            self.position.unmake_move(move, undo)

            if score > best_score:
                best_score = score
                best_move = move
            if score > alpha:
                alpha = score
            if alpha >= beta:
                if quiet:
                    self._record_quiet_cutoff(move, depth, ply, previous_move, quiets_searched)
                self.tt.store(key, depth, beta, TT_LOWER, move, static_eval, ply)
                return beta
            if quiet:
                quiets_searched.append(move)

        if legal_count == 0:
            return -MATE + ply if in_check else 0
        flag = TT_EXACT if alpha > original_alpha else TT_UPPER
        self.tt.store(key, depth, alpha, flag, best_move, static_eval, ply)
        return alpha

    def _quiescence(self, alpha: int, beta: int, ply: int, qply: int) -> int:
        self.nodes += 1
        self._check_time()
        if ply >= MAX_PLY - 2:
            return self.position.evaluate()
        if self.position.halfmove >= 100 or self._is_repetition(ply):
            return 0
        in_check = self.position.in_check()
        if qply >= 18:
            return -MATE + ply if in_check else self.position.evaluate()

        if in_check:
            stand_pat = -INF
            moves = self.position.generate_moves()
        else:
            stand_pat = self.position.evaluate()
            if stand_pat >= beta:
                return beta
            if stand_pat > alpha:
                alpha = stand_pat
            moves = self.position.generate_moves(tactical=True)

        if not moves:
            if in_check:
                return -MATE + ply
            if self.position.total_non_pawn_pieces() <= 2 and not self._has_any_legal_move():
                return 0
            return alpha

        ordered = self._order_tactical(moves)
        legal_count = 0
        for move in ordered:
            captured = (move >> 15) & 7
            promotion = (move >> 18) & 7
            gives_check = self.position.gives_check_fast(move)
            see_score = self.position.see(move)
            if not in_check and not promotion:
                if see_score < -70 and not gives_check:
                    continue
                victim_gain = 0 if captured == NO_CAPTURE else NON_KING_VALUE[captured]
                if stand_pat + victim_gain + 130 < alpha and not gives_check:
                    continue
            undo = self.position.make_move(move)
            if undo is None:
                continue
            legal_count += 1
            self.path_keys[ply + 1] = self.position.hash_key
            score = -self._quiescence(-beta, -alpha, ply + 1, qply + 1)
            self.position.unmake_move(move, undo)
            if score >= beta:
                return beta
            if score > alpha:
                alpha = score
        if in_check and legal_count == 0:
            return -MATE + ply
        return alpha

    def _order_moves(
        self, moves: list[int], tt_move: int, ply: int, previous_move: int
    ) -> list[int]:
        side = self.position.side
        counter = 0
        if previous_move:
            previous_piece = (previous_move >> 12) & 7
            previous_to = (previous_move >> 6) & 63
            previous_side = side ^ 1
            counter = self.countermoves[previous_side * 6 + previous_piece][previous_to]
        killer_one = self.killers[ply][0]
        killer_two = self.killers[ply][1]
        scored: list[tuple[int, int]] = []
        for move in moves:
            if move == tt_move:
                score = 10_000_000
            else:
                captured = (move >> 15) & 7
                promotion = (move >> 18) & 7
                if captured != NO_CAPTURE or promotion:
                    see_score = self.position.see(move)
                    attacker = (move >> 12) & 7
                    victim_value = 0 if captured == NO_CAPTURE else NON_KING_VALUE[captured]
                    capture_order = victim_value * 16 - NON_KING_VALUE[attacker]
                    if promotion:
                        capture_order += 2_000 + promotion * 100
                    score = (8_000_000 if see_score >= 0 else 1_000_000) + capture_order + see_score
                elif move == killer_one:
                    score = 7_000_000
                elif move == killer_two:
                    score = 6_900_000
                elif move == counter:
                    score = 6_800_000
                else:
                    from_square = move & 63
                    to_square = (move >> 6) & 63
                    history_score = self.history[side][from_square][to_square]
                    score = (
                        3_000_000
                        + history_score
                        + self.position.positional_move_bonus(move) * 32
                    )
            scored.append((score, move))
        scored.sort(reverse=True)
        return [move for _, move in scored]

    def _order_tactical(self, moves: list[int]) -> list[int]:
        scored: list[tuple[int, int]] = []
        for move in moves:
            captured = (move >> 15) & 7
            attacker = (move >> 12) & 7
            promotion = (move >> 18) & 7
            victim = 0 if captured == NO_CAPTURE else NON_KING_VALUE[captured]
            score = victim * 16 - NON_KING_VALUE[attacker] + self.position.see(move) * 2
            if promotion:
                score += 3_000 + 300 * promotion
            if self.position.gives_check_fast(move):
                score += 1_200
            scored.append((score, move))
        scored.sort(reverse=True)
        return [move for _, move in scored]

    def _record_quiet_cutoff(
        self, move: int, depth: int, ply: int, previous_move: int, quiets_searched: list[int]
    ) -> None:
        if self.killers[ply][0] != move:
            self.killers[ply][1] = self.killers[ply][0]
            self.killers[ply][0] = move
        side = self.position.side
        from_square = move & 63
        to_square = (move >> 6) & 63
        bonus = min(2_000, depth * depth * 36 + 32)
        self._update_history(side, from_square, to_square, bonus)
        malus = min(700, depth * depth * 8)
        for quiet in quiets_searched:
            self._update_history(side, quiet & 63, (quiet >> 6) & 63, -malus)
        if previous_move:
            previous_piece = (previous_move >> 12) & 7
            previous_to = (previous_move >> 6) & 63
            previous_side = side ^ 1
            self.countermoves[previous_side * 6 + previous_piece][previous_to] = move

    def _update_history(self, side: int, from_square: int, to_square: int, bonus: int) -> None:
        current = self.history[side][from_square][to_square]
        updated = current + bonus - current * abs(bonus) // 16_384
        self.history[side][from_square][to_square] = max(-16_000, min(16_000, updated))

    def _is_repetition(self, ply: int) -> bool:
        limit = max(0, ply - self.position.halfmove)
        index = ply - 2
        key = self.position.hash_key
        while index >= limit:
            if self.path_keys[index] == key:
                return True
            index -= 2
        return False

    def _has_any_legal_move(self) -> bool:
        for move in self.position.generate_moves():
            undo = self.position.make_move(move)
            if undo is not None:
                self.position.unmake_move(move, undo)
                return True
        return False

    def _check_time(self, force: bool = False) -> None:
        if force or not (self.nodes & self.time_check_mask):
            if time.perf_counter_ns() >= self.deadline_ns:
                raise SearchAbort


_ENGINE = Searcher()


def get_move(fen: str, time_left_ms: int) -> str:
    return _ENGINE.choose_move(fen, time_left_ms)
