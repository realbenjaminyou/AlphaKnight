<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play vs Minimax Chessbot</title>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
  <style>
    :root {
      --bg-main: #16171a;
      --bg-panel: #202227;
      --bg-card: #282b32;
      --text-main: #e6e8eb;
      --text-dim: #9ba1ad;
      --accent: #4fa3d1;
      --sq-light: #ecefe4;
      --sq-dark: #779952;
      --sq-selected: #baca44;
      --sq-highlight: rgba(245, 230, 90, 0.55);
      --sq-move-dot: rgba(20, 85, 30, 0.35);
      --danger: #d9534f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 18px;
    }

    header {
      width: 100%;
      max-width: 1040px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #323640;
      padding-bottom: 8px;
    }

    header h1 {
      font-size: 1.5rem;
      letter-spacing: 0.5px;
      color: #fff;
    }

    header .version {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
    }

    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      width: 100%;
      max-width: 1040px;
      justify-content: center;
    }

    .board-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #board {
      width: 520px;
      height: 520px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }

    @media (max-width: 600px) {
      #board {
        width: 92vw;
        height: 92vw;
      }
    }

    .square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .square.light { background-color: var(--sq-light); }
    .square.dark { background-color: var(--sq-dark); }
    .square.selected { background-color: var(--sq-selected) !important; }
    .square.last-move { background-color: var(--sq-highlight) !important; }

    .coord {
      position: absolute;
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
    }
    .coord.file { bottom: 2px; right: 4px; }
    .coord.rank { top: 2px; left: 4px; }
    .light .coord { color: var(--sq-dark); }
    .dark .coord { color: var(--sq-light); }

    .hint-dot {
      position: absolute;
      width: 28%;
      height: 28%;
      border-radius: 50%;
      background: var(--sq-move-dot);
      pointer-events: none;
      z-index: 5;
    }

    .hint-ring {
      position: absolute;
      width: 80%;
      height: 80%;
      border-radius: 50%;
      border: 5px solid var(--sq-move-dot);
      pointer-events: none;
      z-index: 5;
    }

    .piece {
      font-size: clamp(34px, 7vw, 48px);
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      transition: transform 0.05s ease;
      font-family: "Apple Symbols", "DejaVu Sans", "Segoe UI Symbol", "Noto Sans Symbols", sans-serif;
    }

    .piece.white-piece {
      color: #ffffff;
      text-shadow:
        0 1px 0 #111,
        0 -1px 0 #111,
        1px 0 0 #111,
        -1px 0 0 #111,
        0 2px 5px rgba(0, 0, 0, 0.65);
      filter: drop-shadow(0px 2px 2px rgba(0, 0, 0, 0.45));
    }

    .piece.black-piece {
      color: #1a1a1a;
      text-shadow:
        0 1px 1px rgba(255, 255, 255, 0.4),
        0 -1px 1px rgba(255, 255, 255, 0.4),
        1px 0 1px rgba(255, 255, 255, 0.4),
        -1px 0 1px rgba(255, 255, 255, 0.4);
      filter: drop-shadow(0px 2px 3px rgba(0, 0, 0, 0.5));
    }

    .panel {
      flex: 1;
      min-width: 320px;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--bg-panel);
      padding: 14px 16px;
      border-radius: 6px;
      border: 1px solid #2e323b;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .status-loading { background: #6c5421; color: #ffebaa; }
    .status-ready { background: #1f592f; color: #b7f0c4; }
    .status-thinking { background: #1d4d73; color: #bfe3ff; }

    .eval-meter {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }

    .meter-bar {
      height: 10px;
      width: 100%;
      background-color: #3f4450;
      border-radius: 5px;
      overflow: hidden;
      display: flex;
    }

    #meter-white {
      height: 100%;
      width: 50%;
      background: #e6e8eb;
      transition: width 0.3s ease;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-top: 6px;
    }
    .stats-grid span { color: var(--text-main); font-weight: 500; }

    .history-box {
      height: 180px;
      background: var(--bg-card);
      border-radius: 4px;
      padding: 8px 10px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .history-row {
      display: flex;
      color: var(--text-dim);
    }
    .history-idx { width: 38px; }
    .history-move { width: 85px; color: var(--text-main); }

    .control-row {
      display: flex;
      gap: 8px;
    }

    button, select {
      background: var(--bg-card);
      border: 1px solid #3c414d;
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.15s ease;
    }
    button:hover:not(:disabled), select:hover:not(:disabled) {
      background: #353942;
    }
    button:disabled, select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #promotion-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .promo-dialog {
      background: var(--bg-panel);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #444;
      display: flex;
      gap: 12px;
    }
    .promo-choice {
      width: 64px;
      height: 64px;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      background: rgba(255, 255, 255, 0.05);
    }
    .promo-choice:hover {
      border-color: var(--accent);
      background: var(--bg-card);
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>AlphaKnight Trojan</h1>
      <div class="version">Made by Benjamin You</div>
    </div>
    <div id="runtime-status" class="status-badge status-loading">Loading Pyodide & python-chess...</div>
  </header>

  <div class="main-container">
    <div class="board-wrapper">
      <div id="board"></div>
    </div>

    <div class="panel">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <strong>Engine Diagnostics</strong>
          <span id="eval-label" style="font-family: monospace; font-size: 0.85rem; color: var(--accent);">0.00</span>
        </div>
        <div class="eval-meter">
          <div class="meter-bar">
            <div id="meter-white"></div>
          </div>
        </div>
        <div class="stats-grid">
          <div>Depth: <span id="stat-depth">-</span></div>
          <div>Nodes: <span id="stat-nodes">0</span></div>
          <div>Cutoffs: <span id="stat-nps">0</span></div>
          <div>Time: <span id="stat-time">0 ms</span></div>
        </div>
      </div>

      <div class="card">
        <strong style="font-size: 0.9rem; margin-bottom: 6px; display: block;">Game Notation</strong>
        <div class="history-box" id="move-history"></div>
      </div>

      <div class="card">
        <div class="control-row">
          <button id="btn-new" onclick="startNewGame()" disabled>New Game</button>
          <select id="user-side" onchange="changeSide()" disabled>
            <option value="w">Play White</option>
            <option value="b">Play Black</option>
          </select>
          <select id="think-time" disabled>
            <option value="5000">Blitz (5 s clock)</option>
            <option value="15000" selected>Rapid (15 s clock)</option>
            <option value="60000">Classical (60 s clock)</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div id="promotion-modal">
    <div class="promo-dialog" id="promo-dialog"></div>
  </div>

  <script>
    const UNICODE_PIECES = {
      K: "&#9812;", Q: "&#9813;", R: "&#9814;", B: "&#9815;", N: "&#9816;", P: "&#9817;",
      k: "&#9818;", q: "&#9819;", r: "&#9820;", b: "&#9821;", n: "&#9822;", p: "&#9823;"
    };

    let pyodide = null;
    let selectedSq = -1;
    let legalMoves = [];
    let currentFen = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";
    let boardMailbox = new Array(64).fill(0);
    let playerColor = "w";
    let lastMove = { from: -1, to: -1 };
    let moveList = [];
    let pendingPromotion = null;

    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("runtime-status");

    async function initPyodideRuntime() {
      try {
        pyodide = await loadPyodide();
        statusEl.innerText = "Installing python-chess...";
        await pyodide.loadPackage("micropip");
        const micropip = pyodide.pyimport("micropip");
        await micropip.install("chess");

        statusEl.innerText = "Transpiling agent_2.py...";
        const agentScript = document.getElementById("agent-py-source").textContent;
        await pyodide.runPythonAsync(agentScript);

        await pyodide.runPythonAsync(`
import json
import chess

current_board = chess.Board()

def js_set_fen(fen):
    global current_board
    current_board.set_fen(fen)

def js_get_board_state():
    mailbox = [0] * 64
    for sq in range(64):
        p = current_board.piece_at(sq)
        if p:
            val = p.piece_type
            mailbox[sq] = val if p.color == chess.WHITE else -val

    legal = [m.uci() for m in current_board.legal_moves]
    return json.dumps({
        "mailbox": mailbox,
        "side": "w" if current_board.turn == chess.WHITE else "b",
        "fen": current_board.fen(),
        "legal": legal,
        "is_draw": current_board.is_checkmate() == False and current_board.is_game_over(),
        "in_check": current_board.is_check()
    })

def js_make_move(uci_str):
    try:
        mv = chess.Move.from_uci(uci_str)
        if mv in current_board.legal_moves:
            current_board.push(mv)
            return True
    except:
        pass
    return False

def js_think(clock_ms):
    stats = SearchStats()
    start_ns = time.monotonic_ns()
    deadline_ns = _deadline_from_clock(clock_ms)

    best_move = None
    best_score = 0.0
    searched_depth = 0

    moves = _ordered_moves(current_board)
    if moves:
        best_move = moves[0]

    for depth in range(1, MAX_SEARCH_DEPTH + 1):
        try:
            cand, score = _search_root(current_board, depth, deadline_ns=deadline_ns, stats=stats)
            if cand is not None:
                best_move = cand
                best_score = score
                searched_depth = depth
        except SearchTimeout:
            break

    elapsed_ms = max(0, (time.monotonic_ns() - start_ns) // 1_000_000)
    return json.dumps({
        "move": best_move.uci() if best_move else "0000",
        "score": best_score,
        "depth": searched_depth,
        "nodes": stats.nodes,
        "cutoffs": stats.cutoffs,
        "time": elapsed_ms
    })
        `);

        statusEl.innerText = "Engine Ready";
        statusEl.className = "status-badge status-ready";
        document.getElementById("btn-new").disabled = false;
        document.getElementById("user-side").disabled = false;
        document.getElementById("think-time").disabled = false;

        syncBoardState();
      } catch (err) {
        statusEl.innerText = "Initialization Failed";
        statusEl.className = "status-badge status-loading";
        statusEl.style.background = "var(--danger)";
        console.error(err);
      }
    }

    function syncBoardState() {
      const data = JSON.parse(pyodide.globals.get("js_get_board_state")());
      boardMailbox = data.mailbox;
      legalMoves = data.legal;
      currentFen = data.fen;
      renderBoard();

      if (data.side !== playerColor && !data.is_draw && legalMoves.length > 0) {
        triggerEngineMove();
      } else {
        checkGameStatus(data);
      }
    }

    function checkGameStatus(state) {
      if (state.legal.length === 0) {
        if (state.in_check) {
          statusEl.innerText = state.side === playerColor ? "Checkmate - Engine Wins" : "Checkmate - You Win!";
        } else {
          statusEl.innerText = "Draw by Stalemate";
        }
        statusEl.className = "status-badge";
      } else if (state.is_draw) {
        statusEl.innerText = "Game Drawn";
        statusEl.className = "status-badge";
      }
    }

    function renderBoard() {
      boardEl.innerHTML = "";
      const isFlipped = playerColor === "b";

      for (let displayRow = 0; displayRow < 8; displayRow++) {
        for (let displayCol = 0; displayCol < 8; displayCol++) {
          const file = isFlipped ? 7 - displayCol : displayCol;
          const rank = isFlipped ? displayRow : 7 - displayRow;
          const sq = rank * 8 + file;
          const isLight = (file + rank) % 2 !== 0;

          const sqDiv = document.createElement("div");
          sqDiv.className = `square ${isLight ? "light" : "dark"}`;
          sqDiv.dataset.sq = sq;

          if (sq === selectedSq) sqDiv.classList.add("selected");
          if (sq === lastMove.from || sq === lastMove.to) sqDiv.classList.add("last-move");

          if (displayCol === 0) {
            const rankSpan = document.createElement("span");
            rankSpan.className = "coord rank";
            rankSpan.innerText = rank + 1;
            sqDiv.appendChild(rankSpan);
          }
          if (displayRow === 7) {
            const fileSpan = document.createElement("span");
            fileSpan.className = "coord file";
            fileSpan.innerText = String.fromCharCode(97 + file);
            sqDiv.appendChild(fileSpan);
          }

          const pieceVal = boardMailbox[sq];
          if (pieceVal !== 0) {
            const pCode = getPieceChar(pieceVal);
            const isWhite = pieceVal > 0;
            const pieceDiv = document.createElement("div");
            pieceDiv.className = `piece ${isWhite ? "white-piece" : "black-piece"}`;
            pieceDiv.innerHTML = UNICODE_PIECES[pCode] || "";
            sqDiv.appendChild(pieceDiv);
          }

          if (selectedSq !== -1) {
            const fromUci = sqToUci(selectedSq);
            const toUci = sqToUci(sq);
            const moveMatch = legalMoves.find(m => m.startsWith(fromUci + toUci));
            if (moveMatch) {
              const hint = document.createElement("div");
              hint.className = pieceVal === 0 ? "hint-dot" : "hint-ring";
              sqDiv.appendChild(hint);
            }
          }

          sqDiv.addEventListener("click", () => handleSquareClick(sq));
          boardEl.appendChild(sqDiv);
        }
      }
    }

    function handleSquareClick(sq) {
      const data = JSON.parse(pyodide.globals.get("js_get_board_state")());
      if (data.side !== playerColor || legalMoves.length === 0) return;

      const piece = boardMailbox[sq];
      const isOwnPiece = (playerColor === "w" && piece > 0) || (playerColor === "b" && piece < 0);

      if (selectedSq === -1) {
        if (isOwnPiece) {
          selectedSq = sq;
          renderBoard();
        }
      } else {
        if (sq === selectedSq) {
          selectedSq = -1;
          renderBoard();
          return;
        }

        const fromStr = sqToUci(selectedSq);
        const toStr = sqToUci(sq);
        const uciPrefix = fromStr + toStr;
        const matching = legalMoves.filter(m => m.startsWith(uciPrefix));

        if (matching.length === 1 && matching[0].length === 4) {
          applyMove(matching[0]);
        } else if (matching.length > 0 && matching[0].length === 5) {
          openPromotion(selectedSq, sq);
        } else if (isOwnPiece) {
          selectedSq = sq;
          renderBoard();
        } else {
          selectedSq = -1;
          renderBoard();
        }
      }
    }

    function openPromotion(from, to) {
      pendingPromotion = { from, to };
      const dialog = document.getElementById("promo-dialog");
      dialog.innerHTML = "";
      const isWhite = playerColor === "w";
      const promos = isWhite ? ["Q", "R", "B", "N"] : ["q", "r", "b", "n"];

      promos.forEach(p => {
        const choice = document.createElement("div");
        choice.className = `promo-choice piece ${isWhite ? "white-piece" : "black-piece"}`;
        choice.innerHTML = UNICODE_PIECES[p];
        choice.onclick = () => {
          document.getElementById("promotion-modal").style.display = "none";
          applyMove(sqToUci(pendingPromotion.from) + sqToUci(pendingPromotion.to) + p.toLowerCase());
        };
        dialog.appendChild(choice);
      });
      document.getElementById("promotion-modal").style.display = "flex";
    }

    function applyMove(uci) {
      selectedSq = -1;
      const success = pyodide.globals.get("js_make_move")(uci);
      if (success) {
        const f = parseUciSq(uci.slice(0, 2));
        const t = parseUciSq(uci.slice(2, 4));
        lastMove = { from: f, to: t };
        recordMoveHistory(uci);
        syncBoardState();
      }
    }

    async function triggerEngineMove() {
      statusEl.innerText = "Minimax thinking...";
      statusEl.className = "status-badge status-thinking";

      const clockMs = parseInt(document.getElementById("think-time").value, 10);

      setTimeout(() => {
        const resJson = pyodide.globals.get("js_think")(clockMs);
        const res = JSON.parse(resJson);

        if (res.move && res.move !== "0000") {
          applyMove(res.move);
          updateDiagnostics(res);
        }

        statusEl.innerText = "Engine Ready";
        statusEl.className = "status-badge status-ready";
      }, 30);
    }

    function updateDiagnostics(info) {
      document.getElementById("stat-depth").innerText = info.depth;
      document.getElementById("stat-nodes").innerText = info.nodes.toLocaleString();
      document.getElementById("stat-time").innerText = `${info.time} ms`;
      document.getElementById("stat-nps").innerText = `${info.cutoffs}`;

      let cp = info.score;
      if (playerColor === "b") cp = -cp;
      const evalText = Math.abs(cp) >= 50000
        ? `Mate`
        : (cp >= 0 ? `+${cp.toFixed(1)}` : cp.toFixed(1));
      document.getElementById("eval-label").innerText = evalText;

      const evalPercent = 50 + 50 * (2 / (1 + Math.exp(-0.35 * cp)) - 1);
      document.getElementById("meter-white").style.width = `${Math.max(5, Math.min(95, evalPercent))}%`;
    }

    function recordMoveHistory(uci) {
      moveList.push(uci);
      const historyEl = document.getElementById("move-history");
      if (moveList.length % 2 !== 0) {
        const turnNo = Math.ceil(moveList.length / 2);
        const row = document.createElement("div");
        row.className = "history-row";
        row.id = `turn-${turnNo}`;
        row.innerHTML = `<span class="history-idx">${turnNo}.</span><span class="history-move">${uci}</span>`;
        historyEl.appendChild(row);
      } else {
        const turnNo = moveList.length / 2;
        const row = document.getElementById(`turn-${turnNo}`);
        if (row) {
          row.innerHTML += `<span class="history-move">${uci}</span>`;
        }
      }
      historyEl.scrollTop = historyEl.scrollHeight;
    }

    function startNewGame() {
      moveList = [];
      document.getElementById("move-history").innerHTML = "";
      lastMove = { from: -1, to: -1 };
      selectedSq = -1;
      pyodide.globals.get("js_set_fen")("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1");
      syncBoardState();
    }

    function changeSide() {
      playerColor = document.getElementById("user-side").value;
      startNewGame();
    }

    function getPieceChar(p) {
      // 1: P, 2: N, 3: B, 4: R, 5: Q, 6: K
      const map = { 1: "P", 2: "N", 3: "B", 4: "R", 5: "Q", 6: "K", "-1": "p", "-2": "n", "-3": "b", "-4": "r", "-5": "q", "-6": "k" };
      return map[p] || "";
    }

    function sqToUci(sq) {
      return String.fromCharCode(97 + (sq & 7)) + ((sq >> 3) + 1);
    }

    function parseUciSq(s) {
      return (parseInt(s[1], 10) - 1) * 8 + (s.charCodeAt(0) - 97);
    }

    window.addEventListener("DOMContentLoaded", initPyodideRuntime);
  </script>

  <script type="text/python" id="agent-py-source">
"""AI Chessathon agent: material minimax with alpha-beta pruning."""

from __future__ import annotations

import math
import time
from dataclasses import dataclass

import chess

MAX_SEARCH_DEPTH = 3
MAX_THINK_TIME_MS = 1_000
CLOCK_FRACTION = 0.05
CLOCK_RESERVE_MS = 25

MATE_SCORE = 100_000
NO_MOVE = "0000"

PIECE_VALUE: dict[chess.PieceType, int] = {
    chess.PAWN: 1,
    chess.KNIGHT: 3,
    chess.BISHOP: 3,
    chess.ROOK: 5,
    chess.QUEEN: 9,
    chess.KING: 1_000,
}


class SearchTimeout(Exception):
    """Raised internally when the current search iteration runs out of time."""


@dataclass
class SearchStats:
    """Optional counters used by focused tests and local profiling."""

    nodes: int = 0
    cutoffs: int = 0


def evaluate_material(board: chess.Board) -> int:
    score = 0
    for piece_type, value in PIECE_VALUE.items():
        score += value * (
            len(board.pieces(piece_type, chess.WHITE))
            - len(board.pieces(piece_type, chess.BLACK))
        )
    return score


def _terminal_score(board: chess.Board, ply_from_root: int) -> float | None:
    outcome = board.outcome(claim_draw=False)
    if outcome is not None:
        if outcome.winner is None:
            return 0.0
        if outcome.winner == chess.WHITE:
            return float(MATE_SCORE - ply_from_root)
        return float(-MATE_SCORE + ply_from_root)

    if board.can_claim_draw():
        return 0.0
    return None


def _move_order_score(board: chess.Board, move: chess.Move) -> int:
    score = 0

    if move.promotion is not None:
        score += 20_000 + 100 * PIECE_VALUE[move.promotion]

    if board.is_capture(move):
        attacker = board.piece_at(move.from_square)
        attacker_value = PIECE_VALUE[attacker.piece_type] if attacker is not None else 0

        if board.is_en_passant(move):
            victim_value = PIECE_VALUE[chess.PAWN]
        else:
            victim = board.piece_at(move.to_square)
            victim_value = PIECE_VALUE[victim.piece_type] if victim is not None else 0

        score += 10_000 + 100 * victim_value - attacker_value

    return score


def _ordered_moves(board: chess.Board) -> list[chess.Move]:
    moves = list(board.legal_moves)
    moves.sort(key=lambda move: _move_order_score(board, move), reverse=True)
    return moves


def _check_deadline(deadline_ns: int | None) -> None:
    if deadline_ns is not None and time.monotonic_ns() >= deadline_ns:
        raise SearchTimeout


def minimax(
    board: chess.Board,
    depth_remaining: int,
    alpha: float,
    beta: float,
    ply_from_root: int,
    *,
    deadline_ns: int | None = None,
    stats: SearchStats | None = None,
) -> float:
    _check_deadline(deadline_ns)
    if stats is not None:
        stats.nodes += 1

    terminal = _terminal_score(board, ply_from_root)
    if terminal is not None:
        return terminal
    if depth_remaining == 0:
        return float(evaluate_material(board))

    moves = _ordered_moves(board)

    if board.turn == chess.WHITE:
        best = -math.inf
        for move in moves:
            board.push(move)
            try:
                score = minimax(
                    board,
                    depth_remaining - 1,
                    alpha,
                    beta,
                    ply_from_root + 1,
                    deadline_ns=deadline_ns,
                    stats=stats,
                )
            finally:
                board.pop()

            if score > best:
                best = score
            if best > alpha:
                alpha = best
            if alpha >= beta:
                if stats is not None:
                    stats.cutoffs += 1
                break
        return best

    best = math.inf
    for move in moves:
        board.push(move)
        try:
            score = minimax(
                board,
                depth_remaining - 1,
                alpha,
                beta,
                ply_from_root + 1,
                deadline_ns=deadline_ns,
                stats=stats,
            )
        finally:
            board.pop()

        if score < best:
            best = score
        if best < beta:
            beta = best
        if alpha >= beta:
            if stats is not None:
                stats.cutoffs += 1
            break
    return best


def _search_root(
    board: chess.Board,
    depth: int,
    *,
    deadline_ns: int | None,
    stats: SearchStats | None = None,
) -> tuple[chess.Move | None, float]:
    _check_deadline(deadline_ns)
    terminal = _terminal_score(board, 0)
    if terminal is not None:
        return None, terminal

    moves = _ordered_moves(board)
    if not moves:
        return None, 0.0

    alpha = -math.inf
    beta = math.inf
    best_move = moves[0]

    if board.turn == chess.WHITE:
        best_score = -math.inf
        for move in moves:
            _check_deadline(deadline_ns)
            board.push(move)
            try:
                score = minimax(
                    board,
                    depth - 1,
                    alpha,
                    beta,
                    1,
                    deadline_ns=deadline_ns,
                    stats=stats,
                )
            finally:
                board.pop()

            if score > best_score:
                best_score = score
                best_move = move
            if best_score > alpha:
                alpha = best_score
        return best_move, best_score

    best_score = math.inf
    for move in moves:
        _check_deadline(deadline_ns)
        board.push(move)
        try:
            score = minimax(
                board,
                depth - 1,
                alpha,
                beta,
                1,
                deadline_ns=deadline_ns,
                stats=stats,
            )
        finally:
            board.pop()

        if score < best_score:
            best_score = score
            best_move = move
        if best_score < beta:
            beta = best_score
    return best_move, best_score


def _deadline_from_clock(time_left_ms: int) -> int:
    now = time.monotonic_ns()
    usable_ms = max(0, time_left_ms - CLOCK_RESERVE_MS)
    budget_ms = min(MAX_THINK_TIME_MS, int(usable_ms * CLOCK_FRACTION))
    return now + budget_ms * 1_000_000


def get_move(fen: str, time_left_ms: int) -> str:
    board = chess.Board(fen)

    if _terminal_score(board, 0) is not None:
        return NO_MOVE

    moves = _ordered_moves(board)
    if not moves:
        return NO_MOVE

    best_move = moves[0]
    deadline_ns = _deadline_from_clock(time_left_ms)

    for depth in range(1, MAX_SEARCH_DEPTH + 1):
        try:
            candidate, _ = _search_root(board, depth, deadline_ns=deadline_ns)
        except SearchTimeout:
            break
        if candidate is not None:
            best_move = candidate

    return best_move.uci()
