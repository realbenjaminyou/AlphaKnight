<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlphaKnight Lance</title>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
  <style>
    :root {
      --bg-main: #16171a;
      --bg-panel: #202227;
      --bg-card: #282b32;
      --text-main: #e6e8eb;
      --text-dim: #9ba1ad;
      --accent: #4fa3d1;
      --sq-light: #ecefe4;
      --sq-dark: #779952;
      --sq-selected: #baca44;
      --sq-highlight: rgba(245, 230, 90, 0.55);
      --sq-move-dot: rgba(20, 85, 30, 0.35);
      --danger: #d9534f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 18px;
    }

    header {
      width: 100%;
      max-width: 1040px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #323640;
      padding-bottom: 8px;
    }

    header h1 {
      font-size: 1.5rem;
      letter-spacing: 0.5px;
      color: #fff;
    }

    header .version {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
    }

    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      width: 100%;
      max-width: 1040px;
      justify-content: center;
    }

    .board-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #board {
      width: 520px;
      height: 520px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }

    @media (max-width: 600px) {
      #board {
        width: 92vw;
        height: 92vw;
      }
    }

    .square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .square.light { background-color: var(--sq-light); }
    .square.dark { background-color: var(--sq-dark); }
    .square.selected { background-color: var(--sq-selected) !important; }
    .square.last-move { background-color: var(--sq-highlight) !important; }

    .coord {
      position: absolute;
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
    }
    .coord.file { bottom: 2px; right: 4px; }
    .coord.rank { top: 2px; left: 4px; }
    .light .coord { color: var(--sq-dark); }
    .dark .coord { color: var(--sq-light); }

    .hint-dot {
      position: absolute;
      width: 28%;
      height: 28%;
      border-radius: 50%;
      background: var(--sq-move-dot);
      pointer-events: none;
      z-index: 5;
    }

    .hint-ring {
      position: absolute;
      width: 80%;
      height: 80%;
      border-radius: 50%;
      border: 5px solid var(--sq-move-dot);
      pointer-events: none;
      z-index: 5;
    }

    .piece {
      font-size: clamp(34px, 7vw, 48px);
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      transition: transform 0.05s ease;
      font-family: "Apple Symbols", "DejaVu Sans", "Segoe UI Symbol", "Noto Sans Symbols", sans-serif;
    }

    .piece.white-piece {
      color: #ffffff;
      text-shadow:
        0 1px 0 #111,
        0 -1px 0 #111,
        1px 0 0 #111,
        -1px 0 0 #111,
        0 2px 5px rgba(0, 0, 0, 0.65);
      filter: drop-shadow(0px 2px 2px rgba(0, 0, 0, 0.45));
    }

    .piece.black-piece {
      color: #1a1a1a;
      text-shadow:
        0 1px 1px rgba(255, 255, 255, 0.4),
        0 -1px 1px rgba(255, 255, 255, 0.4),
        1px 0 1px rgba(255, 255, 255, 0.4),
        -1px 0 1px rgba(255, 255, 255, 0.4);
      filter: drop-shadow(0px 2px 3px rgba(0, 0, 0, 0.5));
    }

    .panel {
      flex: 1;
      min-width: 320px;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--bg-panel);
      padding: 14px 16px;
      border-radius: 6px;
      border: 1px solid #2e323b;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .status-loading { background: #6c5421; color: #ffebaa; }
    .status-ready { background: #1f592f; color: #b7f0c4; }
    .status-thinking { background: #1d4d73; color: #bfe3ff; }

    .eval-meter {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }

    .meter-bar {
      height: 10px;
      width: 100%;
      background-color: #3f4450;
      border-radius: 5px;
      overflow: hidden;
      display: flex;
    }

    #meter-white {
      height: 100%;
      width: 50%;
      background: #e6e8eb;
      transition: width 0.3s ease;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-top: 6px;
    }
    .stats-grid span { color: var(--text-main); font-weight: 500; }

    .history-box {
      height: 180px;
      background: var(--bg-card);
      border-radius: 4px;
      padding: 8px 10px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .history-row {
      display: flex;
      color: var(--text-dim);
    }
    .history-idx { width: 38px; }
    .history-move { width: 85px; color: var(--text-main); }

    .control-row {
      display: flex;
      gap: 8px;
    }

    button, select {
      background: var(--bg-card);
      border: 1px solid #3c414d;
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.15s ease;
    }
    button:hover:not(:disabled), select:hover:not(:disabled) {
      background: #353942;
    }
    button:disabled, select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #promotion-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .promo-dialog {
      background: var(--bg-panel);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #444;
      display: flex;
      gap: 12px;
    }
    .promo-choice {
      width: 64px;
      height: 64px;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      background: rgba(255, 255, 255, 0.05);
    }
    .promo-choice:hover {
      border-color: var(--accent);
      background: var(--bg-card);
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Classical Chess Agent</h1>
      <div class="version">Version 1.0.0 by Benjamin You</div>
    </div>
    <div id="runtime-status" class="status-badge status-loading">Loading Pyodide &amp; python-chess...</div>
  </header>

  <div class="main-container">
    <div class="board-wrapper">
      <div id="board"></div>
    </div>

    <div class="panel">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <strong>Engine Diagnostics</strong>
          <span id="eval-label" style="font-family: monospace; font-size: 0.85rem; color: var(--accent);">0.00</span>
        </div>
        <div class="eval-meter">
          <div class="meter-bar">
            <div id="meter-white"></div>
          </div>
        </div>
        <div class="stats-grid">
          <div>Depth: <span id="stat-depth">-</span></div>
          <div>Nodes: <span id="stat-nodes">0</span></div>
          <div>Speed: <span id="stat-nps">- kn/s</span></div>
          <div>Time: <span id="stat-time">0 ms</span></div>
        </div>
      </div>

      <div class="card">
        <strong style="font-size: 0.9rem; margin-bottom: 6px; display: block;">Game Notation</strong>
        <div class="history-box" id="move-history"></div>
      </div>

      <div class="card">
        <div class="control-row">
          <button id="btn-new" onclick="startNewGame()" disabled>New Game</button>
          <select id="user-side" onchange="changeSide()" disabled>
            <option value="w">Play White</option>
            <option value="b">Play Black</option>
          </select>
          <select id="think-time" disabled>
            <option value="5000">Blitz (5 s clock)</option>
            <option value="15000" selected>Rapid (15 s clock)</option>
            <option value="60000">Classical (60 s clock)</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div id="promotion-modal">
    <div class="promo-dialog" id="promo-dialog"></div>
  </div>

  <script>
    const UNICODE_PIECES = {
      K: "&#9812;", Q: "&#9813;", R: "&#9814;", B: "&#9815;", N: "&#9816;", P: "&#9817;",
      k: "&#9818;", q: "&#9819;", r: "&#9820;", b: "&#9821;", n: "&#9822;", p: "&#9823;"
    };

    let pyodide = null;
    let selectedSq = -1;
    let legalMoves = [];
    let currentFen = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";
    let boardMailbox = new Array(64).fill(0);
    let playerColor = "w";
    let lastMove = { from: -1, to: -1 };
    let moveList = [];
    let pendingPromotion = null;

    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("runtime-status");

    async function initPyodideRuntime() {
      try {
        pyodide = await loadPyodide();
        statusEl.innerText = "Installing python-chess...";
        await pyodide.loadPackage("micropip");
        const micropip = pyodide.pyimport("micropip");
        await micropip.install("chess");

        statusEl.innerText = "Transpiling classical agent...";
        const agentScript = document.getElementById("agent-py-source").textContent;
        await pyodide.runPythonAsync(agentScript);

        await pyodide.runPythonAsync(`
import json
import chess

current_board = chess.Board()

def js_set_fen(fen):
    global current_board
    current_board.set_fen(fen)

def js_get_board_state():
    mailbox = [0] * 64
    for sq in range(64):
        p = current_board.piece_at(sq)
        if p:
            val = p.piece_type
            mailbox[sq] = val if p.color == chess.WHITE else -val

    legal = [m.uci() for m in current_board.legal_moves]
    return json.dumps({
        "mailbox": mailbox,
        "side": "w" if current_board.turn == chess.WHITE else "b",
        "fen": current_board.fen(),
        "legal": legal,
        "is_draw": current_board.is_checkmate() == False and current_board.is_game_over(),
        "in_check": current_board.is_check()
    })

def js_make_move(uci_str):
    try:
        mv = chess.Move.from_uci(uci_str)
        if mv in current_board.legal_moves:
            current_board.push(mv)
            return True
    except:
        pass
    return False

def js_think(clock_ms):
    fen_str = current_board.fen()
    start_ns = time.perf_counter()
    best_move_uci = get_move(fen_str, clock_ms)
    elapsed_ms = max(1, int((time.perf_counter() - start_ns) * 1000))

    key = _position_key(current_board)
    probe = _TT.probe(key, 0)
    score = probe.score if probe is not None else _evaluate(current_board)
    depth = probe.depth if probe is not None and probe.depth > 0 else 1

    return json.dumps({
        "move": best_move_uci,
        "score": score,
        "depth": depth,
        "nodes": _ENGINE.nodes,
        "time": elapsed_ms
    })
        `);

        statusEl.innerText = "Engine Ready";
        statusEl.className = "status-badge status-ready";
        document.getElementById("btn-new").disabled = false;
        document.getElementById("user-side").disabled = false;
        document.getElementById("think-time").disabled = false;

        syncBoardState();
      } catch (err) {
        statusEl.innerText = "Initialization Failed";
        statusEl.className = "status-badge status-loading";
        statusEl.style.background = "var(--danger)";
        console.error(err);
      }
    }

    function syncBoardState() {
      const data = JSON.parse(pyodide.globals.get("js_get_board_state")());
      boardMailbox = data.mailbox;
      legalMoves = data.legal;
      currentFen = data.fen;
      renderBoard();

      if (data.side !== playerColor && !data.is_draw && legalMoves.length > 0) {
        triggerEngineMove();
      } else {
        checkGameStatus(data);
      }
    }

    function checkGameStatus(state) {
      if (state.legal.length === 0) {
        if (state.in_check) {
          statusEl.innerText = state.side === playerColor ? "Checkmate - Engine Wins" : "Checkmate - You Win!";
        } else {
          statusEl.innerText = "Draw by Stalemate";
        }
        statusEl.className = "status-badge";
      } else if (state.is_draw) {
        statusEl.innerText = "Game Drawn";
        statusEl.className = "status-badge";
      }
    }

    function renderBoard() {
      boardEl.innerHTML = "";
      const isFlipped = playerColor === "b";

      for (let displayRow = 0; displayRow < 8; displayRow++) {
        for (let displayCol = 0; displayCol < 8; displayCol++) {
          const file = isFlipped ? 7 - displayCol : displayCol;
          const rank = isFlipped ? displayRow : 7 - displayRow;
          const sq = rank * 8 + file;
          const isLight = (file + rank) % 2 !== 0;

          const sqDiv = document.createElement("div");
          sqDiv.className = `square ${isLight ? "light" : "dark"}`;
          sqDiv.dataset.sq = sq;

          if (sq === selectedSq) sqDiv.classList.add("selected");
          if (sq === lastMove.from || sq === lastMove.to) sqDiv.classList.add("last-move");

          if (displayCol === 0) {
            const rankSpan = document.createElement("span");
            rankSpan.className = "coord rank";
            rankSpan.innerText = rank + 1;
            sqDiv.appendChild(rankSpan);
          }
          if (displayRow === 7) {
            const fileSpan = document.createElement("span");
            fileSpan.className = "coord file";
            fileSpan.innerText = String.fromCharCode(97 + file);
            sqDiv.appendChild(fileSpan);
          }

          const pieceVal = boardMailbox[sq];
          if (pieceVal !== 0) {
            const pCode = getPieceChar(pieceVal);
            const isWhite = pieceVal > 0;
            const pieceDiv = document.createElement("div");
            pieceDiv.className = `piece ${isWhite ? "white-piece" : "black-piece"}`;
            pieceDiv.innerHTML = UNICODE_PIECES[pCode] || "";
            sqDiv.appendChild(pieceDiv);
          }

          if (selectedSq !== -1) {
            const fromUci = sqToUci(selectedSq);
            const toUci = sqToUci(sq);
            const moveMatch = legalMoves.find(m => m.startsWith(fromUci + toUci));
            if (moveMatch) {
              const hint = document.createElement("div");
              hint.className = pieceVal === 0 ? "hint-dot" : "hint-ring";
              sqDiv.appendChild(hint);
            }
          }

          sqDiv.addEventListener("click", () => handleSquareClick(sq));
          boardEl.appendChild(sqDiv);
        }
      }
    }

    function handleSquareClick(sq) {
      const data = JSON.parse(pyodide.globals.get("js_get_board_state")());
      if (data.side !== playerColor || legalMoves.length === 0) return;

      const piece = boardMailbox[sq];
      const isOwnPiece = (playerColor === "w" && piece > 0) || (playerColor === "b" && piece < 0);

      if (selectedSq === -1) {
        if (isOwnPiece) {
          selectedSq = sq;
          renderBoard();
        }
      } else {
        if (sq === selectedSq) {
          selectedSq = -1;
          renderBoard();
          return;
        }

        const fromStr = sqToUci(selectedSq);
        const toStr = sqToUci(sq);
        const uciPrefix = fromStr + toStr;
        const matching = legalMoves.filter(m => m.startsWith(uciPrefix));

        if (matching.length === 1 && matching[0].length === 4) {
          applyMove(matching[0]);
        } else if (matching.length > 0 && matching[0].length === 5) {
          openPromotion(selectedSq, sq);
        } else if (isOwnPiece) {
          selectedSq = sq;
          renderBoard();
        } else {
          selectedSq = -1;
          renderBoard();
        }
      }
    }

    function openPromotion(from, to) {
      pendingPromotion = { from, to };
      const dialog = document.getElementById("promo-dialog");
      dialog.innerHTML = "";
      const isWhite = playerColor === "w";
      const promos = isWhite ? ["Q", "R", "B", "N"] : ["q", "r", "b", "n"];

      promos.forEach(p => {
        const choice = document.createElement("div");
        choice.className = `promo-choice piece ${isWhite ? "white-piece" : "black-piece"}`;
        choice.innerHTML = UNICODE_PIECES[p];
        choice.onclick = () => {
          document.getElementById("promotion-modal").style.display = "none";
          applyMove(sqToUci(pendingPromotion.from) + sqToUci(pendingPromotion.to) + p.toLowerCase());
        };
        dialog.appendChild(choice);
      });
      document.getElementById("promotion-modal").style.display = "flex";
    }

    function applyMove(uci) {
      selectedSq = -1;
      const success = pyodide.globals.get("js_make_move")(uci);
      if (success) {
        const f = parseUciSq(uci.slice(0, 2));
        const t = parseUciSq(uci.slice(2, 4));
        lastMove = { from: f, to: t };
        recordMoveHistory(uci);
        syncBoardState();
      }
    }

    async function triggerEngineMove() {
      statusEl.innerText = "Engine thinking...";
      statusEl.className = "status-badge status-thinking";

      const clockMs = parseInt(document.getElementById("think-time").value, 10);

      setTimeout(() => {
        const resJson = pyodide.globals.get("js_think")(clockMs);
        const res = JSON.parse(resJson);

        if (res.move && res.move !== "0000") {
          applyMove(res.move);
          updateDiagnostics(res);
        }

        statusEl.innerText = "Engine Ready";
        statusEl.className = "status-badge status-ready";
      }, 30);
    }

    function updateDiagnostics(info) {
      document.getElementById("stat-depth").innerText = info.depth;
      document.getElementById("stat-nodes").innerText = info.nodes.toLocaleString();
      document.getElementById("stat-time").innerText = `${info.time} ms`;
      const knps = info.time > 0 ? (info.nodes / info.time).toFixed(1) : "0.0";
      document.getElementById("stat-nps").innerText = `${knps} kn/s`;

      let cp = info.score;
      if (playerColor === "b") cp = -cp;
      const evalText = Math.abs(cp) >= 29000
        ? `Mate ${30000 - Math.abs(cp)}`
        : (cp >= 0 ? `+${(cp / 100).toFixed(2)}` : (cp / 100).toFixed(2));
      document.getElementById("eval-label").innerText = evalText;

      const evalPercent = 50 + 50 * (2 / (1 + Math.exp(-0.004 * cp)) - 1);
      document.getElementById("meter-white").style.width = `${Math.max(5, Math.min(95, evalPercent))}%`;
    }

    function recordMoveHistory(uci) {
      moveList.push(uci);
      const historyEl = document.getElementById("move-history");
      if (moveList.length % 2 !== 0) {
        const turnNo = Math.ceil(moveList.length / 2);
        const row = document.createElement("div");
        row.className = "history-row";
        row.id = `turn-${turnNo}`;
        row.innerHTML = `<span class="history-idx">${turnNo}.</span><span class="history-move">${uci}</span>`;
        historyEl.appendChild(row);
      } else {
        const turnNo = moveList.length / 2;
        const row = document.getElementById(`turn-${turnNo}`);
        if (row) {
          row.innerHTML += `<span class="history-move">${uci}</span>`;
        }
      }
      historyEl.scrollTop = historyEl.scrollHeight;
    }

    function startNewGame() {
      moveList = [];
      document.getElementById("move-history").innerHTML = "";
      lastMove = { from: -1, to: -1 };
      selectedSq = -1;
      pyodide.globals.get("js_set_fen")("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1");
      syncBoardState();
    }

    function changeSide() {
      playerColor = document.getElementById("user-side").value;
      startNewGame();
    }

    function getPieceChar(p) {
      const map = { 1: "P", 2: "N", 3: "B", 4: "R", 5: "Q", 6: "K", "-1": "p", "-2": "n", "-3": "b", "-4": "r", "-5": "q", "-6": "k" };
      return map[p] || "";
    }

    function sqToUci(sq) {
      return String.fromCharCode(97 + (sq & 7)) + ((sq >> 3) + 1);
    }

    function parseUciSq(s) {
      return (parseInt(s[1], 10) - 1) * 8 + (s.charCodeAt(0) - 97);
    }

    window.addEventListener("DOMContentLoaded", initPyodideRuntime);
  </script>

"""Standalone classical chess agent for the competition runner."""

from __future__ import annotations

import math
import time
from array import array
from dataclasses import dataclass
from typing import Final

import chess

# Search score constants.
INF: Final = 32_000
MATE_SCORE: Final = 30_000
MATE_THRESHOLD: Final = 29_000
MAX_PLY: Final = 128
MAX_DEPTH: Final = 64

# Transposition-table flags.
EXACT: Final = 0
LOWERBOUND: Final = 1
UPPERBOUND: Final = 2

# One direct-mapped entry uses 8 + 1 + 2 + 1 + 2 = 14 bytes across the arrays.
TT_SIZE: Final = 1 << 20
TT_MASK: Final = TT_SIZE - 1
TT_EMPTY_DEPTH: Final = -128
MASK64: Final = (1 << 64) - 1

# Piece values are indexed by python-chess piece type (PAWN=1 ... KING=6).
MG_VALUE: Final = (0, 100, 320, 330, 500, 900, 0)
EG_VALUE: Final = (0, 120, 320, 340, 510, 1000, 0)
ORDER_VALUE: Final = (0, 100, 320, 330, 500, 900, 20_000)
PHASE_WEIGHT: Final = (0, 0, 1, 1, 2, 4, 0)
MAX_PHASE: Final = 24

MIRROR: Final = tuple(square ^ 56 for square in range(64))
FILE_MASKS: Final = tuple(sum(1 << (rank * 8 + file_) for rank in range(8)) for file_ in range(8))
ADJACENT_FILE_MASKS: Final = tuple(
    (FILE_MASKS[file_ - 1] if file_ > 0 else 0)
    | (FILE_MASKS[file_ + 1] if file_ < 7 else 0)
    for file_ in range(8)
)


# These tables are generated from simple, symmetric chess heuristics at import time.  This keeps the
# source compact while still leaving every evaluation constant and lookup rule in this one file.
def _build_psqt() -> tuple[tuple[tuple[int, ...], ...], tuple[tuple[int, ...], ...]]:
    mg_tables: list[tuple[int, ...]] = [tuple(0 for _ in range(64))]
    eg_tables: list[tuple[int, ...]] = [tuple(0 for _ in range(64))]

    for piece_type in range(chess.PAWN, chess.KING + 1):
        mg: list[int] = []
        eg: list[int] = []
        for square in range(64):
            file_ = square & 7
            rank = square >> 3
            file_center = 7 - abs(2 * file_ - 7)
            rank_center = 7 - abs(2 * rank - 7)
            center = file_center + rank_center
            edge = min(file_, 7 - file_, rank, 7 - rank)

            if piece_type == chess.PAWN:
                mg_score = (rank - 1) * 7 + file_center * 2
                eg_score = (rank - 1) * 12 + file_center
                if rank in (3, 4):
                    mg_score += 8
            elif piece_type == chess.KNIGHT:
                mg_score = center * 5 + edge * 2 - 36
                eg_score = center * 4 + edge - 30
            elif piece_type == chess.BISHOP:
                mg_score = center * 3 + edge * 2 - 22
                eg_score = center * 3 + edge - 20
                if rank >= 2:
                    mg_score += 4
            elif piece_type == chess.ROOK:
                mg_score = file_center - 4
                eg_score = center - 12
                if rank == 6:
                    mg_score += 18
                    eg_score += 24
            elif piece_type == chess.QUEEN:
                mg_score = center - 15
                eg_score = center * 2 - 24
                if rank >= 2:
                    mg_score -= 3
            else:
                # In the middlegame the king prefers the back rank and castled files.  In the
                # endgame centralisation becomes valuable.
                mg_score = -center * 4 - rank * 6
                if rank == 0 and file_ in (2, 6):
                    mg_score += 26
                elif rank == 0 and file_ in (1, 5):
                    mg_score += 12
                eg_score = center * 5 + edge * 2 - 42

            mg.append(mg_score)
            eg.append(eg_score)

        mg_tables.append(tuple(mg))
        eg_tables.append(tuple(eg))

    return tuple(mg_tables), tuple(eg_tables)


MG_PST, EG_PST = _build_psqt()


def _build_passed_masks() -> tuple[tuple[int, ...], tuple[int, ...]]:
    white_masks: list[int] = []
    black_masks: list[int] = []
    for square in range(64):
        file_ = square & 7
        rank = square >> 3
        white_mask = 0
        black_mask = 0
        for other_file in range(max(0, file_ - 1), min(7, file_ + 1) + 1):
            for other_rank in range(rank + 1, 8):
                white_mask |= 1 << (other_rank * 8 + other_file)
            for other_rank in range(0, rank):
                black_mask |= 1 << (other_rank * 8 + other_file)
        white_masks.append(white_mask)
        black_masks.append(black_mask)
    return tuple(white_masks), tuple(black_masks)


PASSED_MASK_WHITE, PASSED_MASK_BLACK = _build_passed_masks()
PASSED_MG: Final = (0, 0, 8, 16, 30, 52, 82, 0)
PASSED_EG: Final = (0, 0, 14, 28, 52, 88, 142, 0)


def _build_lmr_table() -> tuple[tuple[int, ...], ...]:
    rows: list[tuple[int, ...]] = []
    for depth in range(MAX_DEPTH + 2):
        row: list[int] = []
        for move_count in range(257):
            if depth < 3 or move_count < 4:
                row.append(0)
            else:
                reduction = int(1.0 + math.log(depth) * math.log(move_count) / 2.0)
                row.append(max(1, reduction))
        rows.append(tuple(row))
    return tuple(rows)


LMR_TABLE = _build_lmr_table()


class _SearchTimeout(Exception):
    """Internal non-local exit used when the hard move deadline is reached."""


@dataclass(slots=True, frozen=True)
class _TTProbe:
    depth: int
    score: int
    flag: int
    move: int


class _TranspositionTable:
    """Fixed-size, direct-mapped transposition table with compact typed arrays."""

    def __init__(self) -> None:
        self.keys = array("Q", [0]) * TT_SIZE
        self.depths = array("b", [TT_EMPTY_DEPTH]) * TT_SIZE
        self.scores = array("h", [0]) * TT_SIZE
        self.flags = array("B", [EXACT]) * TT_SIZE
        self.moves = array("H", [0]) * TT_SIZE

    @staticmethod
    def _score_to_tt(score: int, ply: int) -> int:
        if score > MATE_THRESHOLD:
            score += ply
        elif score < -MATE_THRESHOLD:
            score -= ply
        return max(-32_767, min(32_767, score))

    @staticmethod
    def _score_from_tt(score: int, ply: int) -> int:
        if score > MATE_THRESHOLD:
            return score - ply
        if score < -MATE_THRESHOLD:
            return score + ply
        return score

    def probe(self, key: int, ply: int) -> _TTProbe | None:
        index = key & TT_MASK
        if self.depths[index] == TT_EMPTY_DEPTH or self.keys[index] != key:
            return None
        return _TTProbe(
            int(self.depths[index]),
            self._score_from_tt(int(self.scores[index]), ply),
            int(self.flags[index]),
            int(self.moves[index]),
        )

    def store(self, key: int, depth: int, score: int, flag: int, move: int, ply: int) -> None:
        index = key & TT_MASK
        old_depth = int(self.depths[index])
        same_key = old_depth != TT_EMPTY_DEPTH and self.keys[index] == key

        # Keep a substantially deeper collision unless the new result is exact.  Same-position
        # writes always refresh the entry and may update its best move.
        if not same_key and old_depth != TT_EMPTY_DEPTH and old_depth > depth + 2 and flag != EXACT:
            return

        self.keys[index] = key
        self.depths[index] = max(-127, min(127, depth))
        self.scores[index] = self._score_to_tt(score, ply)
        self.flags[index] = flag
        if move != 0 or not same_key:
            self.moves[index] = move


_TT = _TranspositionTable()


def _pack_move(move: chess.Move) -> int:
    promotion = move.promotion or 0
    return move.from_square | (move.to_square << 6) | (promotion << 12)


def _unpack_move(packed: int) -> chess.Move | None:
    if packed == 0:
        return None
    from_square = packed & 63
    to_square = (packed >> 6) & 63
    promotion = (packed >> 12) & 7
    return chess.Move(from_square, to_square, promotion=promotion or None)


def _position_key(board: chess.Board) -> int:
    # Python's tuple hash gives a compact 64-bit process-local key.  Every element is an integer or
    # bool, so it is stable for the lifetime of the game process and inexpensive to recompute.
    key = hash(
        (
            board.pawns,
            board.knights,
            board.bishops,
            board.rooks,
            board.queens,
            board.kings,
            board.occupied_co[chess.WHITE],
            board.occupied_co[chess.BLACK],
            board.turn,
            board.castling_rights,
            board.ep_square if board.ep_square is not None else -1,
            min(board.halfmove_clock, 100),
        )
    )
    return key & MASK64


def _iter_squares(bitboard: int) -> list[int]:
    squares: list[int] = []
    while bitboard:
        lsb = bitboard & -bitboard
        squares.append(lsb.bit_length() - 1)
        bitboard ^= lsb
    return squares


def _king_safety(board: chess.Board, color: bool, own_pawns: int, all_pawns: int) -> int:
    king_square = board.king(color)
    if king_square is None:
        return 0

    king_file = king_square & 7
    king_rank = king_square >> 3
    direction = 1 if color == chess.WHITE else -1
    score = 0

    front_rank = king_rank + direction
    second_rank = king_rank + 2 * direction
    for file_ in range(max(0, king_file - 1), min(7, king_file + 1) + 1):
        if 0 <= front_rank < 8 and own_pawns & (1 << (front_rank * 8 + file_)):
            score += 11
        elif 0 <= second_rank < 8 and own_pawns & (1 << (second_rank * 8 + file_)):
            score += 5

        file_mask = FILE_MASKS[file_]
        if not (own_pawns & file_mask):
            score -= 7
            if not (all_pawns & file_mask):
                score -= 7

    # Uncastled central kings are especially vulnerable while queens remain.
    if king_file in (3, 4) and (board.queens & board.occupied_co[not color]):
        score -= 14
    return score


def _pawn_structure(
    pawns: int,
    enemy_pawns: int,
    color: bool,
) -> tuple[int, int]:
    mg = 0
    eg = 0

    for file_ in range(8):
        count = (pawns & FILE_MASKS[file_]).bit_count()
        if count > 1:
            mg -= 10 * (count - 1)
            eg -= 14 * (count - 1)

    bitboard = pawns
    while bitboard:
        lsb = bitboard & -bitboard
        square = lsb.bit_length() - 1
        bitboard ^= lsb
        file_ = square & 7
        rank = square >> 3

        if not (pawns & ADJACENT_FILE_MASKS[file_]):
            mg -= 12
            eg -= 8

        passed_mask = (
            PASSED_MASK_WHITE[square]
            if color == chess.WHITE
            else PASSED_MASK_BLACK[square]
        )
        if not (enemy_pawns & passed_mask):
            relative_rank = rank if color == chess.WHITE else 7 - rank
            mg += PASSED_MG[relative_rank]
            eg += PASSED_EG[relative_rank]

    return mg, eg


def _evaluate(board: chess.Board) -> int:
    white_occ = board.occupied_co[chess.WHITE]
    black_occ = board.occupied_co[chess.BLACK]

    mg_white = 0
    eg_white = 0
    mg_black = 0
    eg_black = 0
    phase = 0

    piece_bitboards = (
        0,
        board.pawns,
        board.knights,
        board.bishops,
        board.rooks,
        board.queens,
        board.kings,
    )

    for piece_type in range(chess.PAWN, chess.KING + 1):
        pieces = piece_bitboards[piece_type]
        white_pieces = pieces & white_occ
        black_pieces = pieces & black_occ
        white_count = white_pieces.bit_count()
        black_count = black_pieces.bit_count()

        mg_white += MG_VALUE[piece_type] * white_count
        eg_white += EG_VALUE[piece_type] * white_count
        mg_black += MG_VALUE[piece_type] * black_count
        eg_black += EG_VALUE[piece_type] * black_count
        phase += PHASE_WEIGHT[piece_type] * (white_count + black_count)

        bitboard = white_pieces
        while bitboard:
            lsb = bitboard & -bitboard
            square = lsb.bit_length() - 1
            bitboard ^= lsb
            mg_white += MG_PST[piece_type][square]
            eg_white += EG_PST[piece_type][square]

        bitboard = black_pieces
        while bitboard:
            lsb = bitboard & -bitboard
            square = lsb.bit_length() - 1
            bitboard ^= lsb
            mirrored = MIRROR[square]
            mg_black += MG_PST[piece_type][mirrored]
            eg_black += EG_PST[piece_type][mirrored]

    white_bishops = (board.bishops & white_occ).bit_count()
    black_bishops = (board.bishops & black_occ).bit_count()
    if white_bishops >= 2:
        mg_white += 30
        eg_white += 45
    if black_bishops >= 2:
        mg_black += 30
        eg_black += 45

    white_pawns = board.pawns & white_occ
    black_pawns = board.pawns & black_occ
    all_pawns = white_pawns | black_pawns

    white_pawn_mg, white_pawn_eg = _pawn_structure(white_pawns, black_pawns, chess.WHITE)
    black_pawn_mg, black_pawn_eg = _pawn_structure(black_pawns, white_pawns, chess.BLACK)
    mg_white += white_pawn_mg
    eg_white += white_pawn_eg
    mg_black += black_pawn_mg
    eg_black += black_pawn_eg

    white_rooks = board.rooks & white_occ
    black_rooks = board.rooks & black_occ
    for square in _iter_squares(white_rooks):
        file_mask = FILE_MASKS[square & 7]
        if not (white_pawns & file_mask):
            mg_white += 10
            eg_white += 8
            if not (black_pawns & file_mask):
                mg_white += 10
                eg_white += 6
    for square in _iter_squares(black_rooks):
        file_mask = FILE_MASKS[square & 7]
        if not (black_pawns & file_mask):
            mg_black += 10
            eg_black += 8
            if not (white_pawns & file_mask):
                mg_black += 10
                eg_black += 6

    mg_white += _king_safety(board, chess.WHITE, white_pawns, all_pawns)
    mg_black += _king_safety(board, chess.BLACK, black_pawns, all_pawns)

    phase = min(MAX_PHASE, phase)
    mg_score = mg_white - mg_black
    eg_score = eg_white - eg_black
    score = (mg_score * phase + eg_score * (MAX_PHASE - phase)) // MAX_PHASE
    return score if board.turn == chess.WHITE else -score


def _captured_piece_type(board: chess.Board, move: chess.Move) -> int:
    if board.is_en_passant(move):
        return chess.PAWN
    piece_type = board.piece_type_at(move.to_square)
    return piece_type or 0


def _capture_gain(board: chess.Board, move: chess.Move) -> int:
    victim = _captured_piece_type(board, move)
    gain = ORDER_VALUE[victim]
    if move.promotion is not None:
        gain += ORDER_VALUE[move.promotion] - ORDER_VALUE[chess.PAWN]
    return gain


def _simple_see(board: chess.Board, move: chess.Move) -> int:
    """Cheap one-recapture static exchange estimate used for ordering and qsearch pruning."""
    attacker = board.piece_type_at(move.from_square) or chess.PAWN
    gain = _capture_gain(board, move)
    occupying_value = ORDER_VALUE[move.promotion or attacker]

    # If the landing square is defended, assume the opponent can recapture the moved piece.  This
    # deliberately errs on the conservative side; x-rays and second recaptures are handled by
    # search.
    if board.is_attacked_by(not board.turn, move.to_square):
        gain -= occupying_value
    return gain


class _Engine:
    def __init__(self) -> None:
        self.history = [[[0 for _ in range(64)] for _ in range(64)] for _ in range(2)]
        self.killers = [[0, 0] for _ in range(MAX_PLY)]
        self.countermoves = [[0 for _ in range(64)] for _ in range(7)]
        self.board = chess.Board()
        self.start_time = 0.0
        self.target_seconds = 0.0
        self.hard_seconds = 0.0
        self.nodes = 0

    @staticmethod
    def _side_index(color: bool) -> int:
        return 1 if color == chess.WHITE else 0

    def _time_check(self) -> None:
        self.nodes += 1
        if self.nodes & 2047 == 0 and time.perf_counter() - self.start_time >= self.hard_seconds:
            raise _SearchTimeout

    def _ordered_moves(
        self,
        tt_move: chess.Move | None,
        ply: int,
        prev_piece: int,
        prev_to: int,
        *,
        qsearch: bool = False,
        in_check: bool = False,
    ) -> list[chess.Move]:
        side_index = self._side_index(self.board.turn)
        tt_packed = _pack_move(tt_move) if tt_move is not None else 0
        killer_0, killer_1 = self.killers[ply] if ply < MAX_PLY else (0, 0)
        counter = self.countermoves[prev_piece][prev_to] if prev_piece else 0

        tt_found: chess.Move | None = None
        good_captures: list[tuple[int, chess.Move]] = []
        killer_moves: list[tuple[int, chess.Move]] = []
        counter_moves: list[chess.Move] = []
        quiets: list[tuple[int, chess.Move]] = []
        bad_captures: list[tuple[int, chess.Move]] = []

        for move in self.board.legal_moves:
            packed = _pack_move(move)
            is_capture = self.board.is_capture(move)
            is_queen_promotion = move.promotion == chess.QUEEN

            if qsearch and not in_check and not is_capture and not is_queen_promotion:
                continue

            if tt_packed and packed == tt_packed:
                tt_found = move
                continue

            if is_capture or is_queen_promotion:
                victim = _captured_piece_type(self.board, move)
                attacker = self.board.piece_type_at(move.from_square) or chess.PAWN
                mvv_lva = 32 * ORDER_VALUE[victim] - ORDER_VALUE[attacker]
                if is_queen_promotion:
                    mvv_lva += 18_000
                see = _simple_see(self.board, move)
                if see >= 0 or is_queen_promotion:
                    good_captures.append((mvv_lva, move))
                else:
                    bad_captures.append((mvv_lva, move))
                continue

            if not qsearch and packed == killer_0:
                killer_moves.append((2, move))
                continue
            if not qsearch and packed == killer_1:
                killer_moves.append((1, move))
                continue
            if not qsearch and packed == counter:
                counter_moves.append(move)
                continue

            history_score = self.history[side_index][move.from_square][move.to_square]
            if move.promotion is not None:
                history_score -= 2_000
            quiets.append((history_score, move))

        good_captures.sort(key=lambda item: item[0], reverse=True)
        killer_moves.sort(key=lambda item: item[0], reverse=True)
        quiets.sort(key=lambda item: item[0], reverse=True)
        bad_captures.sort(key=lambda item: item[0], reverse=True)

        ordered: list[chess.Move] = []
        if tt_found is not None:
            ordered.append(tt_found)
        ordered.extend(move for _, move in good_captures)
        ordered.extend(move for _, move in killer_moves)
        ordered.extend(counter_moves)
        ordered.extend(move for _, move in quiets)
        ordered.extend(move for _, move in bad_captures)
        return ordered

    def _is_draw(self, ply: int) -> bool:
        return (
            self.board.halfmove_clock >= 100
            or self.board.is_insufficient_material()
            or (ply >= 4 and self.board.is_repetition(2))
        )

    def _has_non_pawn_material(self, color: bool) -> bool:
        pieces = self.board.knights | self.board.bishops | self.board.rooks | self.board.queens
        return bool(pieces & self.board.occupied_co[color])

    def _record_quiet_cutoff(
        self,
        move: chess.Move,
        depth: int,
        ply: int,
        prev_piece: int,
        prev_to: int,
    ) -> None:
        packed = _pack_move(move)
        if ply < MAX_PLY:
            killer_0 = self.killers[ply][0]
            if packed != killer_0:
                self.killers[ply][1] = killer_0
                self.killers[ply][0] = packed

        if prev_piece:
            self.countermoves[prev_piece][prev_to] = packed

        side_index = self._side_index(self.board.turn)
        bonus = min(2_048, 24 * depth * depth)
        current = self.history[side_index][move.from_square][move.to_square]
        current += bonus - current * abs(bonus) // 16_384
        self.history[side_index][move.from_square][move.to_square] = max(
            -16_384, min(16_384, current)
        )

    def _qsearch(self, alpha: int, beta: int, ply: int, prev_piece: int, prev_to: int) -> int:
        self._time_check()
        if ply >= MAX_PLY - 1:
            return _evaluate(self.board)
        if self._is_draw(ply):
            return 0

        in_check = self.board.is_check()
        stand_pat = -INF
        if not in_check:
            stand_pat = _evaluate(self.board)
            if stand_pat >= beta:
                return stand_pat
            if stand_pat > alpha:
                alpha = stand_pat

        key = _position_key(self.board)
        probe = _TT.probe(key, ply)
        tt_move = _unpack_move(probe.move) if probe is not None else None
        moves = self._ordered_moves(
            tt_move,
            ply,
            prev_piece,
            prev_to,
            qsearch=True,
            in_check=in_check,
        )

        if not moves:
            return -MATE_SCORE + ply if in_check else stand_pat

        best_score = stand_pat
        best_move = 0
        original_alpha = alpha

        for move in moves:
            is_capture = self.board.is_capture(move)
            if not in_check and is_capture:
                gain = _capture_gain(self.board, move)
                if stand_pat + gain + 140 < alpha and not self.board.gives_check(move):
                    continue
                if _simple_see(self.board, move) < -80 and move.promotion != chess.QUEEN:
                    continue

            moving_piece = self.board.piece_type_at(move.from_square) or chess.PAWN
            self.board.push(move)
            try:
                score = -self._qsearch(-beta, -alpha, ply + 1, moving_piece, move.to_square)
            finally:
                self.board.pop()

            if score > best_score:
                best_score = score
                best_move = _pack_move(move)
            if score > alpha:
                alpha = score
            if alpha >= beta:
                _TT.store(key, 0, best_score, LOWERBOUND, best_move, ply)
                return best_score

        flag = EXACT if best_score > original_alpha else UPPERBOUND
        _TT.store(key, 0, best_score, flag, best_move, ply)
        return best_score

    def _search(
        self,
        depth: int,
        alpha: int,
        beta: int,
        ply: int,
        allow_null: bool,
        prev_piece: int,
        prev_to: int,
    ) -> int:
        self._time_check()

        if ply >= MAX_PLY - 1:
            return _evaluate(self.board)
        if self._is_draw(ply):
            return 0

        in_check = self.board.is_check()
        if depth <= 0:
            return self._qsearch(alpha, beta, ply, prev_piece, prev_to)
        if in_check:
            depth += 1

        key = _position_key(self.board)
        probe = _TT.probe(key, ply)
        tt_move = _unpack_move(probe.move) if probe is not None else None
        if probe is not None and probe.depth >= depth:
            if probe.flag == EXACT:
                return probe.score
            if probe.flag == LOWERBOUND and probe.score >= beta:
                return probe.score
            if probe.flag == UPPERBOUND and probe.score <= alpha:
                return probe.score

        static_eval = _evaluate(self.board)

        # Reverse futility pruning.  Avoid pruning mate-score windows and checked positions.
        if (
            not in_check
            and depth <= 4
            and beta < MATE_THRESHOLD
            and static_eval - (70 * depth + 20) >= beta
        ):
            return static_eval

        # Null-move pruning.  Requiring non-pawn material avoids the classic zugzwang failures in
        # pawn-only endings.
        if (
            allow_null
            and not in_check
            and depth >= 3
            and static_eval >= beta
            and beta < MATE_THRESHOLD
            and self._has_non_pawn_material(self.board.turn)
        ):
            reduction = 3 + depth // 6
            self.board.push(chess.Move.null())
            try:
                null_score = -self._search(
                    max(0, depth - 1 - reduction),
                    -beta,
                    -beta + 1,
                    ply + 1,
                    False,
                    0,
                    0,
                )
            finally:
                self.board.pop()
            if null_score >= beta:
                return null_score

        moves = self._ordered_moves(tt_move, ply, prev_piece, prev_to)
        if not moves:
            return -MATE_SCORE + ply if in_check else 0

        original_alpha = alpha
        best_score = -INF
        best_move = 0
        move_count = 0

        for move in moves:
            move_count += 1
            is_capture = self.board.is_capture(move)
            is_quiet = not is_capture and move.promotion is None
            packed = _pack_move(move)
            is_killer = ply < MAX_PLY and packed in self.killers[ply]
            gives_check = self.board.gives_check(move)

            # Shallow futility pruning of non-tactical quiet moves.
            if (
                is_quiet
                and not in_check
                and not gives_check
                and depth <= 2
                and move_count > 1
                and static_eval + (110 * depth + 60) <= alpha
            ):
                continue

            moving_piece = self.board.piece_type_at(move.from_square) or chess.PAWN
            self.board.push(move)
            try:
                child_depth = depth - 1
                if move_count == 1:
                    score = -self._search(
                        child_depth,
                        -beta,
                        -alpha,
                        ply + 1,
                        True,
                        moving_piece,
                        move.to_square,
                    )
                else:
                    reduction = 0
                    if is_quiet and depth >= 3 and move_count > 3:
                        table_depth = min(depth, MAX_DEPTH + 1)
                        table_count = min(move_count, 256)
                        reduction = LMR_TABLE[table_depth][table_count]
                        if gives_check or is_killer:
                            reduction = max(0, reduction - 1)
                        reduction = min(reduction, max(0, child_depth - 1))

                    if reduction > 0:
                        score = -self._search(
                            child_depth - reduction,
                            -alpha - 1,
                            -alpha,
                            ply + 1,
                            True,
                            moving_piece,
                            move.to_square,
                        )
                        if score > alpha:
                            score = -self._search(
                                child_depth,
                                -alpha - 1,
                                -alpha,
                                ply + 1,
                                True,
                                moving_piece,
                                move.to_square,
                            )
                    else:
                        score = -self._search(
                            child_depth,
                            -alpha - 1,
                            -alpha,
                            ply + 1,
                            True,
                            moving_piece,
                            move.to_square,
                        )

                    if score > alpha and score < beta:
                        score = -self._search(
                            child_depth,
                            -beta,
                            -alpha,
                            ply + 1,
                            True,
                            moving_piece,
                            move.to_square,
                        )
            finally:
                self.board.pop()

            if score > best_score:
                best_score = score
                best_move = packed
            if score > alpha:
                alpha = score
            if alpha >= beta:
                if is_quiet:
                    self._record_quiet_cutoff(move, depth, ply, prev_piece, prev_to)
                _TT.store(key, depth, best_score, LOWERBOUND, best_move, ply)
                return best_score

        if best_score == -INF:
            best_score = static_eval

        flag = EXACT if best_score > original_alpha else UPPERBOUND
        _TT.store(key, depth, best_score, flag, best_move, ply)
        return best_score

    def _root_search(self, depth: int, alpha: int, beta: int) -> tuple[int, chess.Move]:
        self._time_check()
        in_check = self.board.is_check()
        search_depth = depth + (1 if in_check else 0)
        key = _position_key(self.board)
        probe = _TT.probe(key, 0)
        tt_move = _unpack_move(probe.move) if probe is not None else None
        moves = self._ordered_moves(tt_move, 0, 0, 0)
        if not moves:
            raise ValueError("get_move called on a position without a legal move")

        original_alpha = alpha
        best_score = -INF
        best_move = moves[0]

        for move_count, move in enumerate(moves, start=1):
            if time.perf_counter() - self.start_time >= self.hard_seconds:
                raise _SearchTimeout

            moving_piece = self.board.piece_type_at(move.from_square) or chess.PAWN
            self.board.push(move)
            try:
                child_depth = search_depth - 1
                if move_count == 1:
                    score = -self._search(
                        child_depth,
                        -beta,
                        -alpha,
                        1,
                        True,
                        moving_piece,
                        move.to_square,
                    )
                else:
                    score = -self._search(
                        child_depth,
                        -alpha - 1,
                        -alpha,
                        1,
                        True,
                        moving_piece,
                        move.to_square,
                    )
                    if score > alpha and score < beta:
                        score = -self._search(
                            child_depth,
                            -beta,
                            -alpha,
                            1,
                            True,
                            moving_piece,
                            move.to_square,
                        )
            finally:
                self.board.pop()

            if score > best_score:
                best_score = score
                best_move = move
            if score > alpha:
                alpha = score
            if alpha >= beta:
                break

        if best_score <= original_alpha:
            flag = UPPERBOUND
        elif best_score >= beta:
            flag = LOWERBOUND
        else:
            flag = EXACT
        _TT.store(key, depth, best_score, flag, _pack_move(best_move), 0)
        return best_score, best_move

    def choose_move(self, fen: str, time_left_ms: int) -> str:
        self.board = chess.Board(fen)
        for killers in self.killers:
            killers[0] = 0
            killers[1] = 0
        legal_moves = list(self.board.legal_moves)
        if not legal_moves:
            raise ValueError("get_move called on a position without a legal move")
        if len(legal_moves) == 1:
            return legal_moves[0].uci()

        target_ms = time_left_ms / 25.0 + 400.0
        hard_ms = min(time_left_ms * 0.8, target_ms * 2.5)

        if hard_ms <= 8.0:
            return legal_moves[0].uci()

        self.start_time = time.perf_counter()
        self.target_seconds = max(0.001, target_ms / 1000.0)
        self.hard_seconds = max(0.001, hard_ms / 1000.0)
        self.nodes = 0

        best_move = legal_moves[0]
        previous_score = 0
        last_iteration_seconds = 0.0

        for depth in range(1, MAX_DEPTH + 1):
            iteration_start = time.perf_counter()
            if iteration_start - self.start_time >= self.hard_seconds:
                break

            try:
                if depth == 1:
                    score, candidate = self._root_search(depth, -INF, INF)
                else:
                    delta = 25
                    alpha = max(-INF, previous_score - delta)
                    beta = min(INF, previous_score + delta)
                    while True:
                        score, candidate = self._root_search(depth, alpha, beta)
                        if score <= alpha:
                            delta *= 2
                            alpha = max(-INF, previous_score - delta)
                            beta = min(INF, previous_score + max(25, delta // 2))
                            continue
                        if score >= beta:
                            delta *= 2
                            alpha = max(-INF, previous_score - max(25, delta // 2))
                            beta = min(INF, previous_score + delta)
                            continue
                        break
            except _SearchTimeout:
                break

            best_move = candidate
            previous_score = score
            last_iteration_seconds = time.perf_counter() - iteration_start
            elapsed = time.perf_counter() - self.start_time

            if abs(score) >= MATE_THRESHOLD:
                break
            if elapsed >= self.target_seconds:
                break
            if elapsed + 1.8 * last_iteration_seconds >= self.hard_seconds:
                break

        return best_move.uci()


_ENGINE = _Engine()


def get_move(fen: str, time_left_ms: int) -> str:
    """Return a legal move in UCI notation for the position in ``fen``."""
    return _ENGINE.choose_move(fen, max(0, time_left_ms))
