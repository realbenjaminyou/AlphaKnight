<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play vs Classical Chess Agent</title>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
  <style>
    :root {
      --bg-main: #16171a;
      --bg-panel: #202227;
      --bg-card: #282b32;
      --text-main: #e6e8eb;
      --text-dim: #9ba1ad;
      --accent: #4fa3d1;
      --sq-light: #ecefe4;
      --sq-dark: #779952;
      --sq-selected: #baca44;
      --sq-highlight: rgba(245, 230, 90, 0.55);
      --sq-move-dot: rgba(20, 85, 30, 0.35);
      --danger: #d9534f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 18px;
    }

    header {
      width: 100%;
      max-width: 1040px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #323640;
      padding-bottom: 8px;
    }

    header h1 {
      font-size: 1.5rem;
      letter-spacing: 0.5px;
      color: #fff;
    }

    header .version {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
    }

    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      width: 100%;
      max-width: 1040px;
      justify-content: center;
    }

    .board-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #board {
      width: 520px;
      height: 520px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }

    @media (max-width: 600px) {
      #board {
        width: 92vw;
        height: 92vw;
      }
    }

    .square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .square.light { background-color: var(--sq-light); }
    .square.dark { background-color: var(--sq-dark); }
    .square.selected { background-color: var(--sq-selected) !important; }
    .square.last-move { background-color: var(--sq-highlight) !important; }

    .coord {
      position: absolute;
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
    }
    .coord.file { bottom: 2px; right: 4px; }
    .coord.rank { top: 2px; left: 4px; }
    .light .coord { color: var(--sq-dark); }
    .dark .coord { color: var(--sq-light); }

    .hint-dot {
      position: absolute;
      width: 28%;
      height: 28%;
      border-radius: 50%;
      background: var(--sq-move-dot);
      pointer-events: none;
      z-index: 5;
    }

    .hint-ring {
      position: absolute;
      width: 80%;
      height: 80%;
      border-radius: 50%;
      border: 5px solid var(--sq-move-dot);
      pointer-events: none;
      z-index: 5;
    }

    .piece {
      font-size: clamp(34px, 7vw, 48px);
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      transition: transform 0.05s ease;
      font-family: "Apple Symbols", "DejaVu Sans", "Segoe UI Symbol", "Noto Sans Symbols", sans-serif;
    }

    .piece.white-piece {
      color: #ffffff;
      text-shadow:
        0 1px 0 #111,
        0 -1px 0 #111,
        1px 0 0 #111,
        -1px 0 0 #111,
        0 2px 5px rgba(0, 0, 0, 0.65);
      filter: drop-shadow(0px 2px 2px rgba(0, 0, 0, 0.45));
    }

    .piece.black-piece {
      color: #1a1a1a;
      text-shadow:
        0 1px 1px rgba(255, 255, 255, 0.4),
        0 -1px 1px rgba(255, 255, 255, 0.4),
        1px 0 1px rgba(255, 255, 255, 0.4),
        -1px 0 1px rgba(255, 255, 255, 0.4);
      filter: drop-shadow(0px 2px 3px rgba(0, 0, 0, 0.5));
    }

    .panel {
      flex: 1;
      min-width: 320px;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--bg-panel);
      padding: 14px 16px;
      border-radius: 6px;
      border: 1px solid #2e323b;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .status-loading { background: #6c5421; color: #ffebaa; }
    .status-ready { background: #1f592f; color: #b7f0c4; }
    .status-thinking { background: #1d4d73; color: #bfe3ff; }

    .eval-meter {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }

    .meter-bar {
      height: 10px;
      width: 100%;
      background-color: #3f4450;
      border-radius: 5px;
      overflow: hidden;
      display: flex;
    }

    #meter-white {
      height: 100%;
      width: 50%;
      background: #e6e8eb;
      transition: width 0.3s ease;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-top: 6px;
    }
    .stats-grid span { color: var(--text-main); font-weight: 500; }

    .history-box {
      height: 180px;
      background: var(--bg-card);
      border-radius: 4px;
      padding: 8px 10px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .history-row {
      display: flex;
      color: var(--text-dim);
    }
    .history-idx { width: 38px; }
    .history-move { width: 85px; color: var(--text-main); }

    .control-row {
      display: flex;
      gap: 8px;
    }

    button, select {
      background: var(--bg-card);
      border: 1px solid #3c414d;
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.15s ease;
    }
    button:hover:not(:disabled), select:hover:not(:disabled) {
      background: #353942;
    }
    button:disabled, select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #promotion-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .promo-dialog {
      background: var(--bg-panel);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #444;
      display: flex;
      gap: 12px;
    }
    .promo-choice {
      width: 64px;
      height: 64px;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      background: rgba(255, 255, 255, 0.05);
    }
    .promo-choice:hover {
      border-color: var(--accent);
      background: var(--bg-card);
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>AlphaKnight Paladin</h1>
      <div class="version">By Benjamin You</div>
    </div>
    <div id="runtime-status" class="status-badge status-loading">Loading Pyodide &amp; python-chess...</div>
  </header>

  <div class="main-container">
    <div class="board-wrapper">
      <div id="board"></div>
    </div>

    <div class="panel">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <strong>Engine Diagnostics</strong>
          <span id="eval-label" style="font-family: monospace; font-size: 0.85rem; color: var(--accent);">0.00</span>
        </div>
        <div class="eval-meter">
          <div class="meter-bar">
            <div id="meter-white"></div>
          </div>
        </div>
        <div class="stats-grid">
          <div>Depth: <span id="stat-depth">-</span></div>
          <div>Nodes: <span id="stat-nodes">0</span></div>
          <div>Speed: <span id="stat-nps">- kn/s</span></div>
          <div>Time: <span id="stat-time">0 ms</span></div>
        </div>
      </div>

      <div class="card">
        <strong style="font-size: 0.9rem; margin-bottom: 6px; display: block;">Game Notation</strong>
        <div class="history-box" id="move-history"></div>
      </div>

      <div class="card">
        <div class="control-row">
          <button id="btn-new" onclick="startNewGame()" disabled>New Game</button>
          <select id="user-side" onchange="changeSide()" disabled>
            <option value="w">Play White</option>
            <option value="b">Play Black</option>
          </select>
          <select id="think-time" disabled>
            <option value="5000">Blitz (5 s clock)</option>
            <option value="15000" selected>Rapid (15 s clock)</option>
            <option value="60000">Classical (60 s clock)</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div id="promotion-modal">
    <div class="promo-dialog" id="promo-dialog"></div>
  </div>

  <script>
    const UNICODE_PIECES = {
      K: "&#9812;", Q: "&#9813;", R: "&#9814;", B: "&#9815;", N: "&#9816;", P: "&#9817;",
      k: "&#9818;", q: "&#9819;", r: "&#9820;", b: "&#9821;", n: "&#9822;", p: "&#9823;"
    };

    let pyodide = null;
    let selectedSq = -1;
    let legalMoves = [];
    let currentFen = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";
    let boardMailbox = new Array(64).fill(0);
    let playerColor = "w";
    let lastMove = { from: -1, to: -1 };
    let moveList = [];
    let pendingPromotion = null;

    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("runtime-status");

    async function initPyodideRuntime() {
      try {
        pyodide = await loadPyodide();
        statusEl.innerText = "Installing python-chess...";
        await pyodide.loadPackage("micropip");
        const micropip = pyodide.pyimport("micropip");
        await micropip.install("chess");

        statusEl.innerText = "Transpiling classical agent...";
        const agentScript = document.getElementById("agent-py-source").textContent;
        await pyodide.runPythonAsync(agentScript);

        await pyodide.runPythonAsync(`
import json
import chess

current_board = chess.Board()

def js_set_fen(fen):
    global current_board, _GAME_KEYS, _LAST_ROOT_PLY
    current_board.set_fen(fen)
    _GAME_KEYS.clear()
    _LAST_ROOT_PLY = None

def js_get_board_state():
    mailbox = [0] * 64
    for sq in range(64):
        p = current_board.piece_at(sq)
        if p:
            val = p.piece_type
            mailbox[sq] = val if p.color == chess.WHITE else -val

    legal = [m.uci() for m in current_board.legal_moves]
    return json.dumps({
        "mailbox": mailbox,
        "side": "w" if current_board.turn == chess.WHITE else "b",
        "fen": current_board.fen(),
        "legal": legal,
        "is_draw": current_board.is_checkmate() == False and current_board.is_game_over(),
        "in_check": current_board.is_check()
    })

def js_make_move(uci_str):
    try:
        mv = chess.Move.from_uci(uci_str)
        if mv in current_board.legal_moves:
            current_board.push(mv)
            return True
    except:
        pass
    return False

def js_think(clock_ms):
    fen_str = current_board.fen()
    start_ns = time.perf_counter_ns()
    best_move_uci = get_move(fen_str, clock_ms)
    elapsed_ms = max(1, int((time.perf_counter_ns() - start_ns) / 1_000_000))

    key = _position_key(current_board)
    tt_k = _tt_key(current_board, key)
    entry = _TT[tt_k & TT_MASK]

    if entry is not None and entry.key == tt_k:
        score = _score_from_tt(entry.score, 0)
        depth = entry.depth
    else:
        score = _evaluate(current_board)
        depth = 1

    return json.dumps({
        "move": best_move_uci,
        "score": score,
        "depth": depth,
        "nodes": 0,
        "time": elapsed_ms
    })
        `);

        statusEl.innerText = "Engine Ready";
        statusEl.className = "status-badge status-ready";
        document.getElementById("btn-new").disabled = false;
        document.getElementById("user-side").disabled = false;
        document.getElementById("think-time").disabled = false;

        syncBoardState();
      } catch (err) {
        statusEl.innerText = "Initialization Failed";
        statusEl.className = "status-badge status-loading";
        statusEl.style.background = "var(--danger)";
        console.error(err);
      }
    }

    function syncBoardState() {
      const data = JSON.parse(pyodide.globals.get("js_get_board_state")());
      boardMailbox = data.mailbox;
      legalMoves = data.legal;
      currentFen = data.fen;
      renderBoard();

      if (data.side !== playerColor && !data.is_draw && legalMoves.length > 0) {
        triggerEngineMove();
      } else {
        checkGameStatus(data);
      }
    }

    function checkGameStatus(state) {
      if (state.legal.length === 0) {
        if (state.in_check) {
          statusEl.innerText = state.side === playerColor ? "Checkmate - Engine Wins" : "Checkmate - You Win!";
        } else {
          statusEl.innerText = "Draw by Stalemate";
        }
        statusEl.className = "status-badge";
      } else if (state.is_draw) {
        statusEl.innerText = "Game Drawn";
        statusEl.className = "status-badge";
      }
    }

    function renderBoard() {
      boardEl.innerHTML = "";
      const isFlipped = playerColor === "b";

      for (let displayRow = 0; displayRow < 8; displayRow++) {
        for (let displayCol = 0; displayCol < 8; displayCol++) {
          const file = isFlipped ? 7 - displayCol : displayCol;
          const rank = isFlipped ? displayRow : 7 - displayRow;
          const sq = rank * 8 + file;
          const isLight = (file + rank) % 2 !== 0;

          const sqDiv = document.createElement("div");
          sqDiv.className = `square ${isLight ? "light" : "dark"}`;
          sqDiv.dataset.sq = sq;

          if (sq === selectedSq) sqDiv.classList.add("selected");
          if (sq === lastMove.from || sq === lastMove.to) sqDiv.classList.add("last-move");

          if (displayCol === 0) {
            const rankSpan = document.createElement("span");
            rankSpan.className = "coord rank";
            rankSpan.innerText = rank + 1;
            sqDiv.appendChild(rankSpan);
          }
          if (displayRow === 7) {
            const fileSpan = document.createElement("span");
            fileSpan.className = "coord file";
            fileSpan.innerText = String.fromCharCode(97 + file);
            sqDiv.appendChild(fileSpan);
          }

          const pieceVal = boardMailbox[sq];
          if (pieceVal !== 0) {
            const pCode = getPieceChar(pieceVal);
            const isWhite = pieceVal > 0;
            const pieceDiv = document.createElement("div");
            pieceDiv.className = `piece ${isWhite ? "white-piece" : "black-piece"}`;
            pieceDiv.innerHTML = UNICODE_PIECES[pCode] || "";
            sqDiv.appendChild(pieceDiv);
          }

          if (selectedSq !== -1) {
            const fromUci = sqToUci(selectedSq);
            const toUci = sqToUci(sq);
            const moveMatch = legalMoves.find(m => m.startsWith(fromUci + toUci));
            if (moveMatch) {
              const hint = document.createElement("div");
              hint.className = pieceVal === 0 ? "hint-dot" : "hint-ring";
              sqDiv.appendChild(hint);
            }
          }

          sqDiv.addEventListener("click", () => handleSquareClick(sq));
          boardEl.appendChild(sqDiv);
        }
      }
    }

    function handleSquareClick(sq) {
      const data = JSON.parse(pyodide.globals.get("js_get_board_state")());
      if (data.side !== playerColor || legalMoves.length === 0) return;

      const piece = boardMailbox[sq];
      const isOwnPiece = (playerColor === "w" && piece > 0) || (playerColor === "b" && piece < 0);

      if (selectedSq === -1) {
        if (isOwnPiece) {
          selectedSq = sq;
          renderBoard();
        }
      } else {
        if (sq === selectedSq) {
          selectedSq = -1;
          renderBoard();
          return;
        }

        const fromStr = sqToUci(selectedSq);
        const toStr = sqToUci(sq);
        const uciPrefix = fromStr + toStr;
        const matching = legalMoves.filter(m => m.startsWith(uciPrefix));

        if (matching.length === 1 && matching[0].length === 4) {
          applyMove(matching[0]);
        } else if (matching.length > 0 && matching[0].length === 5) {
          openPromotion(selectedSq, sq);
        } else if (isOwnPiece) {
          selectedSq = sq;
          renderBoard();
        } else {
          selectedSq = -1;
          renderBoard();
        }
      }
    }

    function openPromotion(from, to) {
      pendingPromotion = { from, to };
      const dialog = document.getElementById("promo-dialog");
      dialog.innerHTML = "";
      const isWhite = playerColor === "w";
      const promos = isWhite ? ["Q", "R", "B", "N"] : ["q", "r", "b", "n"];

      promos.forEach(p => {
        const choice = document.createElement("div");
        choice.className = `promo-choice piece ${isWhite ? "white-piece" : "black-piece"}`;
        choice.innerHTML = UNICODE_PIECES[p];
        choice.onclick = () => {
          document.getElementById("promotion-modal").style.display = "none";
          applyMove(sqToUci(pendingPromotion.from) + sqToUci(pendingPromotion.to) + p.toLowerCase());
        };
        dialog.appendChild(choice);
      });
      document.getElementById("promotion-modal").style.display = "flex";
    }

    function applyMove(uci) {
      selectedSq = -1;
      const success = pyodide.globals.get("js_make_move")(uci);
      if (success) {
        const f = parseUciSq(uci.slice(0, 2));
        const t = parseUciSq(uci.slice(2, 4));
        lastMove = { from: f, to: t };
        recordMoveHistory(uci);
        syncBoardState();
      }
    }

    async function triggerEngineMove() {
      statusEl.innerText = "Engine thinking...";
      statusEl.className = "status-badge status-thinking";

      const clockMs = parseInt(document.getElementById("think-time").value, 10);

      setTimeout(() => {
        const resJson = pyodide.globals.get("js_think")(clockMs);
        const res = JSON.parse(resJson);

        if (res.move && res.move !== "0000") {
          applyMove(res.move);
          updateDiagnostics(res);
        }

        statusEl.innerText = "Engine Ready";
        statusEl.className = "status-badge status-ready";
      }, 30);
    }

    function updateDiagnostics(info) {
      document.getElementById("stat-depth").innerText = info.depth;
      document.getElementById("stat-nodes").innerText = info.nodes.toLocaleString();
      document.getElementById("stat-time").innerText = `${info.time} ms`;
      const knps = info.time > 0 && info.nodes > 0 ? (info.nodes / info.time).toFixed(1) : "-";
      document.getElementById("stat-nps").innerText = `${knps} kn/s`;

      let cp = info.score;
      if (playerColor === "b") cp = -cp;
      const evalText = Math.abs(cp) >= 29000
        ? `Mate ${30000 - Math.abs(cp)}`
        : (cp >= 0 ? `+${(cp / 100).toFixed(2)}` : (cp / 100).toFixed(2));
      document.getElementById("eval-label").innerText = evalText;

      const evalPercent = 50 + 50 * (2 / (1 + Math.exp(-0.004 * cp)) - 1);
      document.getElementById("meter-white").style.width = `${Math.max(5, Math.min(95, evalPercent))}%`;
    }

    function recordMoveHistory(uci) {
      moveList.push(uci);
      const historyEl = document.getElementById("move-history");
      if (moveList.length % 2 !== 0) {
        const turnNo = Math.ceil(moveList.length / 2);
        const row = document.createElement("div");
        row.className = "history-row";
        row.id = `turn-${turnNo}`;
        row.innerHTML = `<span class="history-idx">${turnNo}.</span><span class="history-move">${uci}</span>`;
        historyEl.appendChild(row);
      } else {
        const turnNo = moveList.length / 2;
        const row = document.getElementById(`turn-${turnNo}`);
        if (row) {
          row.innerHTML += `<span class="history-move">${uci}</span>`;
        }
      }
      historyEl.scrollTop = historyEl.scrollHeight;
    }

    function startNewGame() {
      moveList = [];
      document.getElementById("move-history").innerHTML = "";
      lastMove = { from: -1, to: -1 };
      selectedSq = -1;
      pyodide.globals.get("js_set_fen")("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1");
      syncBoardState();
    }

    function changeSide() {
      playerColor = document.getElementById("user-side").value;
      startNewGame();
    }

    function getPieceChar(p) {
      const map = { 1: "P", 2: "N", 3: "B", 4: "R", 5: "Q", 6: "K", "-1": "p", "-2": "n", "-3": "b", "-4": "r", "-5": "q", "-6": "k" };
      return map[p] || "";
    }

    function sqToUci(sq) {
      return String.fromCharCode(97 + (sq & 7)) + ((sq >> 3) + 1);
    }

    function parseUciSq(s) {
      return (parseInt(s[1], 10) - 1) * 8 + (s.charCodeAt(0) - 97);
    }

    window.addEventListener("DOMContentLoaded", initPyodideRuntime);
  </script>

  <!-- Complete Inlined Python Engine Source -->
  <script type="text/python" id="agent-py-source">
from __future__ import annotations

import time
from dataclasses import dataclass
from typing import Final

import chess

INF: Final = 32_000
MATE: Final = 30_000
MATE_TT_THRESHOLD: Final = 29_000
MAX_PLY: Final = 96
TT_SIZE: Final = 1 << 18
TT_MASK: Final = TT_SIZE - 1
EXACT: Final = 0
LOWER: Final = 1
UPPER: Final = 2

PIECE_VALUE: Final[tuple[int, ...]] = (0, 100, 320, 335, 500, 900, 0)
CENTER_FILES: Final = (3, 4)
CORE_SQUARES: Final = (27, 28, 35, 36)
CORE_MASK: Final = sum(1 << square for square in CORE_SQUARES)
EXTENDED_CENTER_MASK: Final = sum(
    1 << (rank * 8 + file_index)
    for rank in range(2, 6)
    for file_index in range(2, 6)
)


def _make_file_masks() -> tuple[int, ...]:
    return tuple(sum(1 << (rank * 8 + file_index) for rank in range(8)) for file_index in range(8))


FILE_MASKS: Final[tuple[int, ...]] = _make_file_masks()
ADJACENT_FILE_MASKS: Final[tuple[int, ...]] = tuple(
    (FILE_MASKS[file_index - 1] if file_index > 0 else 0)
    | (FILE_MASKS[file_index + 1] if file_index < 7 else 0)
    for file_index in range(8)
)


def _make_knight_attacks() -> tuple[int, ...]:
    result: list[int] = []
    for square in range(64):
        file_index = square & 7
        rank = square >> 3
        mask = 0
        for df, dr in ((1, 2), (2, 1), (2, -1), (1, -2), (-1, -2), (-2, -1), (-2, 1), (-1, 2)):
            nf = file_index + df
            nr = rank + dr
            if 0 <= nf < 8 and 0 <= nr < 8:
                mask |= 1 << (nr * 8 + nf)
        result.append(mask)
    return tuple(result)


def _make_king_attacks() -> tuple[int, ...]:
    result: list[int] = []
    for square in range(64):
        file_index = square & 7
        rank = square >> 3
        mask = 0
        for df in (-1, 0, 1):
            for dr in (-1, 0, 1):
                if df == 0 and dr == 0:
                    continue
                nf = file_index + df
                nr = rank + dr
                if 0 <= nf < 8 and 0 <= nr < 8:
                    mask |= 1 << (nr * 8 + nf)
        result.append(mask)
    return tuple(result)


def _make_pawn_attacks() -> tuple[tuple[int, ...], tuple[int, ...]]:
    by_color: list[tuple[int, ...]] = []
    for color in (chess.BLACK, chess.WHITE):
        values: list[int] = []
        step = 1 if color == chess.WHITE else -1
        for square in range(64):
            file_index = square & 7
            rank = square >> 3
            mask = 0
            nr = rank + step
            if 0 <= nr < 8:
                if file_index > 0:
                    mask |= 1 << (nr * 8 + file_index - 1)
                if file_index < 7:
                    mask |= 1 << (nr * 8 + file_index + 1)
            values.append(mask)
        by_color.append(tuple(values))
    return by_color[0], by_color[1]


def _make_passed_masks() -> tuple[tuple[int, ...], tuple[int, ...]]:
    by_color: list[tuple[int, ...]] = []
    for color in (chess.BLACK, chess.WHITE):
        values: list[int] = []
        for square in range(64):
            file_index = square & 7
            rank = square >> 3
            mask = 0
            ranks = range(rank + 1, 8) if color == chess.WHITE else range(rank - 1, -1, -1)
            for nr in ranks:
                for nf in (file_index - 1, file_index, file_index + 1):
                    if 0 <= nf < 8:
                        mask |= 1 << (nr * 8 + nf)
            values.append(mask)
        by_color.append(tuple(values))
    return by_color[0], by_color[1]


def _make_between() -> tuple[tuple[int, ...], ...]:
    table: list[tuple[int, ...]] = []
    for a in range(64):
        row: list[int] = []
        af = a & 7
        ar = a >> 3
        for b in range(64):
            bf = b & 7
            br = b >> 3
            df = bf - af
            dr = br - ar
            if a == b:
                row.append(0)
                continue
            if df == 0:
                sf = 0
                sr = 1 if dr > 0 else -1
            elif dr == 0:
                sf = 1 if df > 0 else -1
                sr = 0
            elif abs(df) == abs(dr):
                sf = 1 if df > 0 else -1
                sr = 1 if dr > 0 else -1
            else:
                row.append(0)
                continue
            nf = af + sf
            nr = ar + sr
            mask = 0
            while (nf, nr) != (bf, br):
                mask |= 1 << (nr * 8 + nf)
                nf += sf
                nr += sr
            row.append(mask)
        table.append(tuple(row))
    return tuple(table)


KNIGHT_ATTACKS: Final[tuple[int, ...]] = _make_knight_attacks()
KING_ATTACKS: Final[tuple[int, ...]] = _make_king_attacks()
PAWN_ATTACKS: Final[tuple[tuple[int, ...], tuple[int, ...]]] = _make_pawn_attacks()
PASSED_MASKS: Final[tuple[tuple[int, ...], tuple[int, ...]]] = _make_passed_masks()
BETWEEN: Final[tuple[tuple[int, ...], ...]] = _make_between()
KING_ZONE: Final[tuple[int, ...]] = tuple(
    KING_ATTACKS[square] | (1 << square) for square in range(64)
)


def _center_score(square: int) -> int:
    file_index = square & 7
    rank = square >> 3
    distance = abs(file_index - 3.5) + abs(rank - 3.5)
    return int(round(18 - 4 * distance))


CENTER_SCORE: Final[tuple[int, ...]] = tuple(_center_score(square) for square in range(64))


def _make_pst() -> tuple[tuple[tuple[int, ...], ...], tuple[tuple[int, ...], ...]]:
    all_colors: list[tuple[tuple[int, ...], ...]] = []
    for color in (chess.BLACK, chess.WHITE):
        per_piece: list[tuple[int, ...]] = [tuple(0 for _ in range(64))]
        for piece_type in range(chess.PAWN, chess.KING + 1):
            values: list[int] = []
            for square in range(64):
                file_index = square & 7
                rank = square >> 3
                rel_rank = rank if color == chess.WHITE else 7 - rank
                center = CENTER_SCORE[square]
                if piece_type == chess.PAWN:
                    value = rel_rank * 4 + max(0, center // 4)
                elif piece_type == chess.KNIGHT:
                    value = center * 2
                elif piece_type == chess.BISHOP:
                    value = center + rel_rank * 2
                elif piece_type == chess.ROOK:
                    value = rel_rank * 2 + (5 if file_index in CENTER_FILES else 0)
                elif piece_type == chess.QUEEN:
                    value = center // 2
                else:
                    edge = min(file_index, 7 - file_index)
                    value = -center + edge * 2
                values.append(value)
            per_piece.append(tuple(values))
        all_colors.append(tuple(per_piece))
    return all_colors[0], all_colors[1]


PST: Final[tuple[tuple[tuple[int, ...], ...], tuple[tuple[int, ...], ...]]] = _make_pst()

WHITE_HOME_MINORS: Final = (1 << chess.B1) | (1 << chess.C1) | (1 << chess.F1) | (1 << chess.G1)
BLACK_HOME_MINORS: Final = (1 << chess.B8) | (1 << chess.C8) | (1 << chess.F8) | (1 << chess.G8)
CASTLED_SQUARES: Final[tuple[tuple[int, ...], tuple[int, ...]]] = (
    (chess.C8, chess.G8),
    (chess.C1, chess.G1),
)
START_QUEEN: Final[tuple[int, int]] = (chess.D8, chess.D1)
START_KING: Final[tuple[int, int]] = (chess.E8, chess.E1)


def _splitmix64(seed: int) -> int:
    value = (seed + 0x9E3779B97F4A7C15) & 0xFFFFFFFFFFFFFFFF
    value = (value ^ (value >> 30)) * 0xBF58476D1CE4E5B9 & 0xFFFFFFFFFFFFFFFF
    value = (value ^ (value >> 27)) * 0x94D049BB133111EB & 0xFFFFFFFFFFFFFFFF
    return value ^ (value >> 31)


def _make_zobrist(count: int, seed: int) -> tuple[int, ...]:
    values: list[int] = []
    value = seed
    for _ in range(count):
        value = _splitmix64(value)
        values.append(value)
    return tuple(values)


Z_PIECES: Final[tuple[int, ...]] = _make_zobrist(12 * 64, 0xC0FFEE1234)
Z_CASTLING: Final[tuple[int, ...]] = _make_zobrist(64, 0x123456789AB)
Z_EP: Final[tuple[int, ...]] = _make_zobrist(8, 0xA51CE55)
Z_TURN: Final = _splitmix64(0xDEADBEEF)
Z_HALFMOVE: Final[tuple[int, ...]] = _make_zobrist(101, 0xF17ECAFE)


@dataclass(slots=True)
class _TTEntry:
    key: int
    depth: int
    score: int
    flag: int
    move: chess.Move | None
    static_eval: int
    age: int


_TT: list[_TTEntry | None] = [None] * TT_SIZE
_TT_AGE = 0
_HISTORY: list[list[list[int]]] = [[[0 for _ in range(64)] for _ in range(64)] for _ in range(2)]
_KILLERS: list[list[chess.Move | None]] = [[None, None] for _ in range(MAX_PLY)]
_COUNTERS: list[chess.Move | None] = [None] * 4096
_GAME_KEYS: list[int] = []
_LAST_ROOT_PLY: int | None = None


class _SearchTimeout(Exception):
    pass


def _bits(mask: int) -> list[int]:
    squares: list[int] = []
    while mask:
        lsb = mask & -mask
        squares.append(lsb.bit_length() - 1)
        mask ^= lsb
    return squares


def _position_key(board: chess.Board) -> int:
    key = 0
    for color in (chess.BLACK, chess.WHITE):
        occupied = board.occupied_co[color]
        color_index = 1 if color == chess.WHITE else 0
        piece_masks = (
            board.pawns,
            board.knights,
            board.bishops,
            board.rooks,
            board.queens,
            board.kings,
        )
        for piece_offset, piece_mask in enumerate(piece_masks):
            mask = piece_mask & occupied
            base = (color_index * 6 + piece_offset) * 64
            while mask:
                lsb = mask & -mask
                square = lsb.bit_length() - 1
                key ^= Z_PIECES[base + square]
                mask ^= lsb
    rights = board.castling_rights
    while rights:
        lsb = rights & -rights
        square = lsb.bit_length() - 1
        key ^= Z_CASTLING[square]
        rights ^= lsb
    if board.ep_square is not None:
        key ^= Z_EP[board.ep_square & 7]
    if board.turn == chess.BLACK:
        key ^= Z_TURN
    return key


def _tt_key(board: chess.Board, position_key: int) -> int:
    clock = min(board.halfmove_clock, 100)
    return position_key ^ Z_HALFMOVE[clock]


def _score_to_tt(score: int, ply: int) -> int:
    if score >= MATE_TT_THRESHOLD:
        return score + ply
    if score <= -MATE_TT_THRESHOLD:
        return score - ply
    return score


def _score_from_tt(score: int, ply: int) -> int:
    if score >= MATE_TT_THRESHOLD:
        return score - ply
    if score <= -MATE_TT_THRESHOLD:
        return score + ply
    return score


def _material(board: chess.Board, color: bool) -> int:
    occupied = board.occupied_co[color]
    return (
        (board.pawns & occupied).bit_count() * 100
        + (board.knights & occupied).bit_count() * 320
        + (board.bishops & occupied).bit_count() * 335
        + (board.rooks & occupied).bit_count() * 500
        + (board.queens & occupied).bit_count() * 900
    )


def _minor_home_count(board: chess.Board, color: bool) -> int:
    occupied = board.occupied_co[color]
    minors = (board.knights | board.bishops) & occupied
    home = WHITE_HOME_MINORS if color == chess.WHITE else BLACK_HOME_MINORS
    return (minors & home).bit_count()


def _is_castled(board: chess.Board, color: bool) -> bool:
    king = board.king(color)
    return king in CASTLED_SQUARES[1 if color == chess.WHITE else 0]


def _pawn_structure(board: chess.Board, color: bool) -> tuple[int, int]:
    own = board.pawns & board.occupied_co[color]
    enemy = board.pawns & board.occupied_co[not color]
    score = 0
    weak = 0
    enemy_files = 0
    for file_index in range(8):
        if enemy & FILE_MASKS[file_index]:
            enemy_files |= 1 << file_index
        count = (own & FILE_MASKS[file_index]).bit_count()
        if count > 1:
            score -= 13 * (count - 1)

    mask = own
    while mask:
        lsb = mask & -mask
        square = lsb.bit_length() - 1
        mask ^= lsb
        file_index = square & 7
        rank = square >> 3
        rel_rank = rank if color == chess.WHITE else 7 - rank
        adjacent = own & ADJACENT_FILE_MASKS[file_index]
        isolated = adjacent == 0
        if isolated:
            score -= 11
            weak |= lsb

        if PASSED_MASKS[1 if color == chess.WHITE else 0][square] & enemy == 0:
            passed_bonus = (0, 4, 8, 16, 30, 50, 82, 0)[rel_rank]
            support = PAWN_ATTACKS[0 if color == chess.WHITE else 1][square] & own
            if support:
                passed_bonus += 12 + rel_rank * 2
            left_clear = (enemy_files & ((1 << file_index) - 1)) == 0
            right_clear = (enemy_files >> (file_index + 1)) == 0
            if (file_index <= 2 and left_clear) or (file_index >= 5 and right_clear):
                passed_bonus += 10
            score += passed_bonus

        attacks = PAWN_ATTACKS[1 if color == chess.WHITE else 0][square]
        if attacks & enemy:
            score += 4

        forward = square + (8 if color == chess.WHITE else -8)
        if 0 <= forward < 64:
            enemy_pawn_attackers = PAWN_ATTACKS[1 if color == chess.WHITE else 0][forward]
            enemy_pawn_attackers &= enemy
            support_band = adjacent
            if color == chess.WHITE:
                below = (1 << (rank * 8)) - 1
                support_band &= ~below
            else:
                above = ~((1 << ((rank + 1) * 8)) - 1)
                support_band &= ~above
            if enemy_pawn_attackers and not support_band:
                score -= 7
                weak |= lsb

        supporters = PAWN_ATTACKS[0 if color == chess.WHITE else 1][square] & own
        if rel_rank >= 4 and not supporters and not isolated:
            score -= 4

    return score, weak


def _rook_connection(board: chess.Board, color: bool) -> bool:
    rooks = board.rooks & board.occupied_co[color]
    if rooks.bit_count() < 2:
        return False
    squares = _bits(rooks)
    for i, first in enumerate(squares):
        for second in squares[i + 1 :]:
            same_file = (first & 7) == (second & 7)
            same_rank = (first >> 3) == (second >> 3)
            if not (same_file or same_rank):
                continue
            between = BETWEEN[first][second]
            if (between & board.occupied) == 0:
                return True
    return False


def _king_shelter(board: chess.Board, color: bool) -> int:
    king = board.king(color)
    if king is None:
        return 0
    file_index = king & 7
    rank = king >> 3
    own_pawns = board.pawns & board.occupied_co[color]
    score = 0
    direction = 1 if color == chess.WHITE else -1
    for df in (-1, 0, 1):
        nf = file_index + df
        if not 0 <= nf < 8:
            continue
        found = False
        for distance in (1, 2):
            nr = rank + direction * distance
            if 0 <= nr < 8 and own_pawns & (1 << (nr * 8 + nf)):
                score += 8 if distance == 1 else 4
                found = True
                break
        if not found:
            score -= 5
    return score


def _piece_activity(
    board: chess.Board,
    color: bool,
    enemy_king: int | None,
    attack_phase: bool,
) -> int:
    own = board.occupied_co[color]
    score = 0
    for piece_type, mobility_weight in (
        (chess.KNIGHT, 2),
        (chess.BISHOP, 2),
        (chess.ROOK, 1),
        (chess.QUEEN, 1),
    ):
        pieces = board.pieces_mask(piece_type, color)
        mask = pieces
        while mask:
            lsb = mask & -mask
            square = lsb.bit_length() - 1
            mask ^= lsb
            attacks = board.attacks_mask(square)
            mobility = (attacks & ~own).bit_count()
            score += min(10, mobility) * mobility_weight
            score += (attacks & CORE_MASK).bit_count() * (3 if piece_type <= chess.BISHOP else 1)
            if attack_phase and enemy_king is not None:
                zone_hits = (attacks & KING_ZONE[enemy_king]).bit_count()
                if piece_type == chess.QUEEN:
                    score += zone_hits * 4
                elif piece_type == chess.ROOK:
                    score += zone_hits * 5
                else:
                    score += zone_hits * 6
    return score


def _evaluate_white(board: chess.Board) -> int:
    score = 0
    phase = (
        board.knights.bit_count()
        + board.bishops.bit_count()
        + board.rooks.bit_count() * 2
        + board.queens.bit_count() * 4
    )
    pawn_info = (
        _pawn_structure(board, chess.BLACK),
        _pawn_structure(board, chess.WHITE),
    )
    for color in (chess.BLACK, chess.WHITE):
        sign = 1 if color == chess.WHITE else -1
        occupied = board.occupied_co[color]
        for piece_type in range(chess.PAWN, chess.KING + 1):
            mask = board.pieces_mask(piece_type, color)
            count = mask.bit_count()
            if piece_type != chess.KING:
                score += sign * PIECE_VALUE[piece_type] * count
            while mask:
                lsb = mask & -mask
                square = lsb.bit_length() - 1
                mask ^= lsb
                score += sign * PST[1 if color == chess.WHITE else 0][piece_type][square]

        pawn_score, _ = pawn_info[1 if color == chess.WHITE else 0]
        _, enemy_weak_pawns = pawn_info[0 if color == chess.WHITE else 1]
        score += sign * pawn_score

        home_minors = _minor_home_count(board, color)
        opening = board.fullmove_number <= 18 and phase >= 14
        if opening:
            score -= sign * home_minors * 19
            if home_minors:
                active_minors = (board.knights | board.bishops) & occupied
                active_minors &= ~(WHITE_HOME_MINORS if color == chess.WHITE else BLACK_HOME_MINORS)
                while active_minors:
                    lsb = active_minors & -active_minors
                    square = lsb.bit_length() - 1
                    active_minors ^= lsb
                    rel_rank = (square >> 3) if color == chess.WHITE else 7 - (square >> 3)
                    if rel_rank >= 3:
                        score -= sign * 6
            queen_square = START_QUEEN[1 if color == chess.WHITE else 0]
            own_queen_on_start = bool(board.queens & occupied & (1 << queen_square))
            if home_minors >= 2 and not own_queen_on_start:
                score -= sign * 9

        castled = _is_castled(board, color)
        if castled:
            score += sign * (32 if opening else 16)
            score += sign * _king_shelter(board, color)
        else:
            king = board.king(color)
            has_rights = (
                board.has_kingside_castling_rights(color)
                or board.has_queenside_castling_rights(color)
            )
            if opening and not has_rights:
                score -= sign * 26
            if king is not None and king == START_KING[1 if color == chess.WHITE else 0]:
                king_file = king & 7
                if not (board.pawns & occupied & FILE_MASKS[king_file]):
                    score -= sign * 22

        own_pawns = board.pawns & occupied
        enemy_pawns = board.pawns & board.occupied_co[not color]
        rooks = board.rooks & occupied
        rook_mask = rooks
        while rook_mask:
            lsb = rook_mask & -rook_mask
            square = lsb.bit_length() - 1
            rook_mask ^= lsb
            file_index = square & 7
            own_on_file = own_pawns & FILE_MASKS[file_index]
            enemy_on_file = enemy_pawns & FILE_MASKS[file_index]
            if not own_on_file:
                score += sign * 9
                if not enemy_on_file:
                    score += sign * 11
            if file_index in CENTER_FILES:
                score += sign * 5
            if enemy_weak_pawns & FILE_MASKS[file_index]:
                score += sign * 6

        connected = _rook_connection(board, color)
        attack_phase = home_minors <= 1 and (castled or connected)
        if attack_phase:
            score += sign * 8
            pawns = own_pawns
            while pawns:
                lsb = pawns & -pawns
                square = lsb.bit_length() - 1
                pawns ^= lsb
                rel_rank = (square >> 3) if color == chess.WHITE else 7 - (square >> 3)
                if rel_rank >= 4:
                    score += sign * min(8, (rel_rank - 3) * 3)

        enemy_king = board.king(not color)
        activity = _piece_activity(board, color, enemy_king, attack_phase)
        score += sign * activity

        enemy_pawn_attacks = 0
        enemy_pawn_mask = enemy_pawns
        enemy_index = 0 if color == chess.WHITE else 1
        while enemy_pawn_mask:
            lsb = enemy_pawn_mask & -enemy_pawn_mask
            square = lsb.bit_length() - 1
            enemy_pawn_mask ^= lsb
            enemy_pawn_attacks |= PAWN_ATTACKS[enemy_index][square]
        for piece_type, penalty in (
            (chess.KNIGHT, 10),
            (chess.BISHOP, 10),
            (chess.ROOK, 16),
            (chess.QUEEN, 25),
        ):
            threatened = board.pieces_mask(piece_type, color) & enemy_pawn_attacks
            score -= sign * threatened.bit_count() * penalty

    white_material = _material(board, chess.WHITE)
    black_material = _material(board, chess.BLACK)
    material_delta = white_material - black_material
    total_nonpawns = (
        board.knights | board.bishops | board.rooks | board.queens
    ).bit_count()
    total_pawns = board.pawns.bit_count()
    if material_delta >= 100:
        simplify = (14 - total_nonpawns) * 3 - (16 - total_pawns)
        score += max(-10, min(42, simplify))
    elif material_delta <= -100:
        simplify = (14 - total_nonpawns) * 3 - (16 - total_pawns)
        score -= max(-10, min(42, simplify))

    if phase <= 8:
        for color in (chess.BLACK, chess.WHITE):
            king = board.king(color)
            if king is not None:
                sign = 1 if color == chess.WHITE else -1
                score += sign * CENTER_SCORE[king] * 2

    return score


def _evaluate(board: chess.Board) -> int:
    score = _evaluate_white(board)
    return score if board.turn == chess.WHITE else -score


def _least_attacker_value(board: chess.Board, color: bool, square: int, exclude: int = -1) -> int:
    attackers = board.attackers_mask(color, square)
    if exclude >= 0:
        attackers &= ~(1 << exclude)
    if not attackers:
        return INF
    for piece_type in (chess.PAWN, chess.KNIGHT, chess.BISHOP, chess.ROOK, chess.QUEEN, chess.KING):
        if attackers & board.pieces_mask(piece_type, color):
            return PIECE_VALUE[piece_type] if piece_type != chess.KING else 20_000
    return INF


def _see_estimate(board: chess.Board, move: chess.Move) -> int:
    moving_type = board.piece_type_at(move.from_square)
    if moving_type is None:
        return -INF
    if board.is_en_passant(move):
        victim_value = 100
    else:
        victim_type = board.piece_type_at(move.to_square)
        victim_value = PIECE_VALUE[victim_type] if victim_type is not None else 0
    gain = victim_value
    attacker_value = PIECE_VALUE[moving_type]
    if move.promotion is not None:
        gain += PIECE_VALUE[move.promotion] - 100
        attacker_value = PIECE_VALUE[move.promotion]
    enemy = not board.turn
    enemy_recapture = _least_attacker_value(board, enemy, move.to_square)
    if enemy_recapture >= INF:
        return gain
    own_recapture = _least_attacker_value(board, board.turn, move.to_square, move.from_square)
    estimate = gain - attacker_value
    if own_recapture < INF:
        estimate += min(enemy_recapture, own_recapture)
    return estimate


def _square_low_threat(board: chess.Board, color: bool, square: int, piece_value: int) -> bool:
    enemy = not color
    enemy_occ = board.occupied_co[enemy]
    enemy_pawns = board.pawns & enemy_occ
    if piece_value > 100 and PAWN_ATTACKS[1 if color == chess.WHITE else 0][square] & enemy_pawns:
        return True
    enemy_knights = board.knights & enemy_occ
    return piece_value > 320 and bool(KNIGHT_ATTACKS[square] & enemy_knights)


def _gives_check_hint(board: chess.Board, move: chess.Move) -> bool:
    color = board.turn
    enemy_king = board.king(not color)
    piece_type = board.piece_type_at(move.from_square)
    if enemy_king is None or piece_type is None:
        return False

    to_square = move.to_square
    king_bit = 1 << enemy_king
    if move.promotion is not None:
        piece_type = move.promotion
    if piece_type == chess.PAWN:
        direct = bool(PAWN_ATTACKS[1 if color == chess.WHITE else 0][to_square] & king_bit)
    elif piece_type == chess.KNIGHT:
        direct = bool(KNIGHT_ATTACKS[to_square] & king_bit)
    elif piece_type == chess.KING:
        direct = bool(KING_ATTACKS[to_square] & king_bit)
    else:
        tf = to_square & 7
        tr = to_square >> 3
        kf = enemy_king & 7
        kr = enemy_king >> 3
        diagonal = abs(tf - kf) == abs(tr - kr)
        orthogonal = tf == kf or tr == kr
        line_piece = (piece_type in (chess.BISHOP, chess.QUEEN) and diagonal) or (
            piece_type in (chess.ROOK, chess.QUEEN) and orthogonal
        )
        occupied = board.occupied & ~(1 << move.from_square)
        if board.is_en_passant(move):
            captured = to_square - 8 if color == chess.WHITE else to_square + 8
            occupied &= ~(1 << captured)
        direct = line_piece and not (BETWEEN[to_square][enemy_king] & occupied)

    if direct:
        return True
    if piece_type == chess.KING and board.is_castling(move):
        return board.gives_check(move)

    ff = move.from_square & 7
    fr = move.from_square >> 3
    kf = enemy_king & 7
    kr = enemy_king >> 3
    aligned = ff == kf or fr == kr or abs(ff - kf) == abs(fr - kr)
    if not aligned and not board.is_en_passant(move):
        return False

    occupied = (board.occupied & ~(1 << move.from_square)) | (1 << to_square)
    if board.is_en_passant(move):
        captured = to_square - 8 if color == chess.WHITE else to_square + 8
        occupied &= ~(1 << captured)
    discovered = board.attackers_mask(color, enemy_king, occupied)
    discovered &= ~(1 << move.from_square)
    return bool(discovered & (board.bishops | board.rooks | board.queens))


def _pawn_break_bonus(board: chess.Board, move: chess.Move, color: bool) -> int:
    piece_type = board.piece_type_at(move.from_square)
    if piece_type != chess.PAWN:
        return 0
    to_square = move.to_square
    file_index = to_square & 7
    rank = to_square >> 3
    target_rank = 3 if color == chess.WHITE else 4
    bonus = 0
    if rank == target_rank and file_index in (2, 3, 4, 5):
        bonus += 1800
    enemy_pawns = board.pawns & board.occupied_co[not color]
    if PAWN_ATTACKS[1 if color == chess.WHITE else 0][to_square] & enemy_pawns:
        bonus += 2400
    return bonus


def _positional_move_bonus(board: chess.Board, move: chess.Move, gives_check: bool) -> int:
    color = board.turn
    piece_type = board.piece_type_at(move.from_square)
    if piece_type is None:
        return 0
    from_square = move.from_square
    to_square = move.to_square
    piece_value = PIECE_VALUE[piece_type] if piece_type != chess.KING else 20_000
    bonus = 0

    if piece_type in (chess.KNIGHT, chess.BISHOP, chess.QUEEN):
        bonus += (CENTER_SCORE[to_square] - CENTER_SCORE[from_square]) * 65
        if (1 << to_square) & CORE_MASK:
            bonus += 900
        elif (1 << to_square) & EXTENDED_CENTER_MASK:
            bonus += 350

    home = WHITE_HOME_MINORS if color == chess.WHITE else BLACK_HOME_MINORS
    if piece_type in (chess.KNIGHT, chess.BISHOP):
        if (1 << from_square) & home and not ((1 << to_square) & home):
            bonus += 2800
        elif board.fullmove_number <= 18 and _minor_home_count(board, color) > 0:
            bonus -= 1600

    if board.is_castling(move):
        bonus += 7800

    bonus += _pawn_break_bonus(board, move, color)

    if piece_type == chess.ROOK:
        file_index = to_square & 7
        own_pawns = board.pawns & board.occupied_co[color]
        enemy_pawns = board.pawns & board.occupied_co[not color]
        if not (own_pawns & FILE_MASKS[file_index]):
            bonus += 1100
            if not (enemy_pawns & FILE_MASKS[file_index]):
                bonus += 900
        if file_index in CENTER_FILES:
            bonus += 500

    from_threat = _square_low_threat(board, color, from_square, piece_value)
    to_threat = _square_low_threat(board, color, to_square, piece_value)
    if from_threat and not to_threat:
        bonus += 2600
    elif to_threat:
        bonus -= 4400

    enemy_occ = board.occupied_co[not color]
    if piece_type == chess.KNIGHT:
        targets = KNIGHT_ATTACKS[to_square] & enemy_occ & (board.rooks | board.queens | board.kings)
        if targets.bit_count() >= 2:
            bonus += 3300
    elif piece_type == chess.PAWN:
        targets = PAWN_ATTACKS[1 if color == chess.WHITE else 0][to_square]
        targets &= enemy_occ & (board.knights | board.bishops | board.rooks | board.queens)
        if targets.bit_count() >= 2:
            bonus += 2600

    enemy_king = board.king(not color)
    if enemy_king is not None:
        zone = KING_ZONE[enemy_king]
        if piece_type == chess.KNIGHT and KNIGHT_ATTACKS[to_square] & zone:
            bonus += 900
        elif (
            piece_type == chess.PAWN
            and PAWN_ATTACKS[1 if color == chess.WHITE else 0][to_square] & zone
        ):
            bonus += 700

    if gives_check:
        bonus += 3600
    return bonus


def _capture_score(
    board: chess.Board, move: chess.Move, material_advantage: int
) -> tuple[int, int]:
    moving_type = board.piece_type_at(move.from_square)
    attacker = PIECE_VALUE[moving_type] if moving_type is not None else 0
    if board.is_en_passant(move):
        victim = 100
        victim_type = chess.PAWN
    else:
        victim_type = board.piece_type_at(move.to_square)
        victim = PIECE_VALUE[victim_type] if victim_type is not None else 0
    see = _see_estimate(board, move)
    score = victim * 32 - attacker + see * 8
    if material_advantage >= 100:
        if victim_type is not None and victim_type != chess.PAWN:
            score += 1800
        elif victim_type == chess.PAWN:
            score -= 500
    return score, see


def _move_code(move: chess.Move) -> int:
    return move.from_square * 64 + move.to_square


class _Searcher:
    def __init__(self, board: chess.Board, deadline_ns: int, root_key: int) -> None:
        self.board = board
        self.deadline_ns = deadline_ns
        self.nodes = 0
        self.root_key = root_key
        self.repetition: dict[int, int] = {}
        for key in _GAME_KEYS:
            self.repetition[key] = self.repetition.get(key, 0) + 1
        if root_key not in self.repetition:
            self.repetition[root_key] = 1
        self.root_best: chess.Move | None = None
        self.root_score = 0

    def _check_time(self) -> None:
        self.nodes += 1
        if self.nodes & 127 == 0 and time.perf_counter_ns() >= self.deadline_ns:
            raise _SearchTimeout

    def _push(self, move: chess.Move) -> int:
        self.board.push(move)
        key = _position_key(self.board)
        self.repetition[key] = self.repetition.get(key, 0) + 1
        return key

    def _pop(self, key: int) -> None:
        count = self.repetition[key] - 1
        if count:
            self.repetition[key] = count
        else:
            del self.repetition[key]
        self.board.pop()

    def _probe(self, tt_key: int) -> _TTEntry | None:
        entry = _TT[tt_key & TT_MASK]
        if entry is not None and entry.key == tt_key:
            return entry
        return None

    def _store(
        self,
        tt_key: int,
        depth: int,
        score: int,
        flag: int,
        move: chess.Move | None,
        static_eval: int,
        ply: int,
    ) -> None:
        global _TT_AGE
        index = tt_key & TT_MASK
        old = _TT[index]
        if old is not None and old.key != tt_key and old.age == _TT_AGE and old.depth > depth + 1:
            return
        _TT[index] = _TTEntry(
            tt_key,
            depth,
            _score_to_tt(score, ply),
            flag,
            move,
            static_eval,
            _TT_AGE,
        )

    def _terminal_or_draw(self, position_key: int, ply: int) -> int | None:
        if self.repetition.get(position_key, 0) >= 3:
            return 0
        if self.board.halfmove_clock >= 100:
            if self.board.is_checkmate():
                return -MATE + ply
            return 0
        if not (self.board.pawns | self.board.rooks | self.board.queens):
            minors = (self.board.knights | self.board.bishops).bit_count()
            if minors <= 1:
                return 0
        return None

    def _ordered_moves(
        self,
        moves: list[chess.Move],
        tt_move: chess.Move | None,
        ply: int,
        previous_move: chess.Move | None,
        qsearch: bool = False,
    ) -> list[chess.Move]:
        color_index = 1 if self.board.turn == chess.WHITE else 0
        killer0, killer1 = _KILLERS[ply] if ply < MAX_PLY else (None, None)
        counter = _COUNTERS[_move_code(previous_move)] if previous_move is not None else None
        scored: list[tuple[int, chess.Move]] = []
        material_advantage = _material(self.board, self.board.turn) - _material(
            self.board, not self.board.turn
        )
        for index, move in enumerate(moves):
            if index % 8 == 0 and time.perf_counter_ns() >= self.deadline_ns:
                raise _SearchTimeout
            if tt_move is not None and move == tt_move:
                scored.append((1_000_000_000, move))
                continue
            capture = self.board.is_capture(move)
            promotion = move.promotion is not None
            gives_check = _gives_check_hint(self.board, move)
            if capture or promotion:
                capture_order, see = _capture_score(self.board, move, material_advantage)
                if promotion:
                    capture_order += PIECE_VALUE[move.promotion or chess.QUEEN] * 12
                if gives_check:
                    capture_order += 4200
                if see >= -20 or promotion:
                    score = 800_000_000 + capture_order
                else:
                    score = 100_000_000 + capture_order
                scored.append((score, move))
                continue
            if qsearch:
                scored.append((300_000_000 if gives_check else 0, move))
                continue
            if move == killer0:
                scored.append((700_000_000, move))
                continue
            if move == killer1:
                scored.append((690_000_000, move))
                continue
            if counter is not None and move == counter:
                scored.append((670_000_000, move))
                continue
            history = _HISTORY[color_index][move.from_square][move.to_square]
            positional = _positional_move_bonus(self.board, move, gives_check)
            scored.append((500_000_000 + history * 16 + positional, move))
        scored.sort(key=lambda item: item[0], reverse=True)
        return [move for _, move in scored]

    def _update_quiet_cutoff(
        self,
        move: chess.Move,
        quiet_tried: list[chess.Move],
        depth: int,
        ply: int,
        previous_move: chess.Move | None,
    ) -> None:
        color_index = 1 if self.board.turn == chess.WHITE else 0
        bonus = min(1800, 24 * depth * depth + 32 * depth)
        current = _HISTORY[color_index][move.from_square][move.to_square]
        _HISTORY[color_index][move.from_square][move.to_square] = min(32_000, current + bonus)
        for failed in quiet_tried:
            if failed == move:
                continue
            old = _HISTORY[color_index][failed.from_square][failed.to_square]
            _HISTORY[color_index][failed.from_square][failed.to_square] = max(
                -32_000, old - bonus // 3
            )
        if ply < MAX_PLY:
            first = _KILLERS[ply][0]
            if first != move:
                _KILLERS[ply][1] = first
                _KILLERS[ply][0] = move
        if previous_move is not None:
            _COUNTERS[_move_code(previous_move)] = move

    def _qsearch(
        self,
        alpha: int,
        beta: int,
        ply: int,
        qply: int,
        position_key: int,
        previous_move: chess.Move | None,
    ) -> int:
        self._check_time()
        terminal = self._terminal_or_draw(position_key, ply)
        if terminal is not None:
            return terminal
        if ply >= MAX_PLY - 2:
            return _evaluate(self.board)

        in_check = self.board.is_check()
        tt_key = _tt_key(self.board, position_key)
        entry = self._probe(tt_key)
        if entry is not None:
            tt_score = _score_from_tt(entry.score, ply)
            if entry.flag == EXACT:
                return max(alpha, min(beta, tt_score))
            if entry.flag == LOWER and tt_score >= beta:
                return beta
            if entry.flag == UPPER and tt_score <= alpha:
                return alpha

        static_eval = entry.static_eval if entry is not None else _evaluate(self.board)
        original_alpha = alpha
        if not in_check:
            if qply >= 10:
                return static_eval
            if static_eval >= beta:
                self._store(tt_key, 0, beta, LOWER, None, static_eval, ply)
                return beta
            if static_eval > alpha:
                alpha = static_eval

        legal = list(self.board.legal_moves)
        if not legal:
            return -MATE + ply if in_check else 0

        tactical: list[chess.Move] = []
        if in_check:
            tactical = legal
        else:
            for move in legal:
                if self.board.is_capture(move):
                    tactical.append(move)
                elif move.promotion == chess.QUEEN:
                    tactical.append(move)
                elif qply < 2 and _gives_check_hint(self.board, move):
                    tactical.append(move)

        if not tactical:
            flag = EXACT if alpha > original_alpha else UPPER
            self._store(tt_key, 0, alpha, flag, None, static_eval, ply)
            return alpha

        tt_move = entry.move if entry is not None else None
        ordered = self._ordered_moves(tactical, tt_move, ply, previous_move, qsearch=True)
        best_move: chess.Move | None = None
        for move in ordered:
            capture = self.board.is_capture(move)
            gives_check = _gives_check_hint(self.board, move)
            if not in_check and capture:
                victim_type = (
                    chess.PAWN
                    if self.board.is_en_passant(move)
                    else self.board.piece_type_at(move.to_square)
                )
                victim = PIECE_VALUE[victim_type] if victim_type is not None else 0
                if (
                    move.promotion is None
                    and static_eval + victim + 120 < alpha
                    and not gives_check
                ):
                    continue
                if (
                    _see_estimate(self.board, move) < -110
                    and not gives_check
                    and move.promotion is None
                ):
                    continue
            child_key = self._push(move)
            try:
                score = -self._qsearch(-beta, -alpha, ply + 1, qply + 1, child_key, move)
            finally:
                self._pop(child_key)
            if score >= beta:
                self._store(tt_key, 0, beta, LOWER, move, static_eval, ply)
                return beta
            if score > alpha:
                alpha = score
                best_move = move

        flag = EXACT if alpha > original_alpha else UPPER
        self._store(tt_key, 0, alpha, flag, best_move, static_eval, ply)
        return alpha

    def _search(
        self,
        depth: int,
        alpha: int,
        beta: int,
        ply: int,
        pv_node: bool,
        allow_null: bool,
        position_key: int,
        previous_move: chess.Move | None,
    ) -> int:
        self._check_time()
        if depth <= 0:
            return self._qsearch(alpha, beta, ply, 0, position_key, previous_move)

        terminal = self._terminal_or_draw(position_key, ply)
        if terminal is not None:
            return terminal
        if ply >= MAX_PLY - 2:
            return _evaluate(self.board)

        alpha = max(alpha, -MATE + ply)
        beta = min(beta, MATE - ply - 1)
        if alpha >= beta:
            return alpha

        in_check = self.board.is_check()
        tt_key = _tt_key(self.board, position_key)
        entry = self._probe(tt_key)
        tt_move = entry.move if entry is not None else None
        if entry is not None and entry.depth >= depth:
            tt_score = _score_from_tt(entry.score, ply)
            if entry.flag == EXACT:
                return max(alpha, min(beta, tt_score))
            if entry.flag == LOWER and tt_score >= beta:
                return beta
            if entry.flag == UPPER and tt_score <= alpha:
                return alpha

        static_eval = entry.static_eval if entry is not None else _evaluate(self.board)

        if (
            not pv_node
            and not in_check
            and depth <= 4
            and static_eval - (95 + depth * 70) >= beta
            and abs(beta) < MATE_TT_THRESHOLD
        ):
            return beta

        own_nonpawn = self.board.occupied_co[self.board.turn]
        own_nonpawn &= (
            self.board.knights | self.board.bishops | self.board.rooks | self.board.queens
        )
        if (
            allow_null
            and not pv_node
            and not in_check
            and depth >= 3
            and own_nonpawn
            and static_eval >= beta + 35
            and abs(beta) < MATE_TT_THRESHOLD
        ):
            margin = max(0, static_eval - beta)
            reduction = 2 + depth // 5 + (1 if margin > 220 else 0)
            reduction = min(4, reduction)
            null_move = chess.Move.null()
            child_key = self._push(null_move)
            try:
                null_score = -self._search(
                    depth - 1 - reduction,
                    -beta,
                    -beta + 1,
                    ply + 1,
                    False,
                    False,
                    child_key,
                    null_move,
                )
            finally:
                self._pop(child_key)
            if null_score >= beta:
                if depth < 7:
                    return beta
                verify = self._search(
                    max(1, depth - reduction),
                    beta - 1,
                    beta,
                    ply,
                    False,
                    False,
                    position_key,
                    previous_move,
                )
                if verify >= beta:
                    return beta

        search_depth = depth
        if tt_move is None and not in_check and depth >= 5:
            search_depth -= 1

        legal = list(self.board.legal_moves)
        if not legal:
            return -MATE + ply if in_check else 0

        ordered = self._ordered_moves(legal, tt_move, ply, previous_move)
        original_alpha = alpha
        best_move: chess.Move | None = None
        quiet_tried: list[chess.Move] = []
        move_count = 0
        for move in ordered:
            capture = self.board.is_capture(move)
            promotion = move.promotion is not None
            quiet = not capture and not promotion
            gives_check = _gives_check_hint(self.board, move)
            move_count += 1

            if (
                quiet
                and not in_check
                and not gives_check
                and search_depth <= 2
                and move_count > 1
                and static_eval + 115 * search_depth + 55 <= alpha
            ):
                continue
            if (
                quiet
                and not pv_node
                and not in_check
                and search_depth <= 4
                and move_count > 7 + search_depth * 2
            ):
                continue
            if capture and not in_check and search_depth <= 3 and move_count > 2:
                see = _see_estimate(self.board, move)
                if see < -85 * search_depth and not gives_check:
                    continue

            parent_color_index = 1 if self.board.turn == chess.WHITE else 0
            child_key = self._push(move)
            new_depth = search_depth - 1
            try:
                if move_count == 1:
                    score = -self._search(
                        new_depth,
                        -beta,
                        -alpha,
                        ply + 1,
                        pv_node,
                        True,
                        child_key,
                        move,
                    )
                else:
                    reduction = 0
                    if (
                        new_depth >= 2
                        and move_count >= 4
                        and quiet
                        and not gives_check
                        and not in_check
                    ):
                        reduction = 1
                        if search_depth >= 6 and move_count >= 8:
                            reduction += 1
                        history = _HISTORY[parent_color_index][move.from_square][move.to_square]
                        if history > 7000:
                            reduction -= 1
                        elif history < -5000 and search_depth >= 5:
                            reduction += 1
                        reduction = max(0, min(reduction, new_depth - 1))

                    reduced_depth = max(0, new_depth - reduction)
                    score = -self._search(
                        reduced_depth,
                        -alpha - 1,
                        -alpha,
                        ply + 1,
                        False,
                        True,
                        child_key,
                        move,
                    )
                    if score > alpha and reduction > 0:
                        score = -self._search(
                            new_depth,
                            -alpha - 1,
                            -alpha,
                            ply + 1,
                            False,
                            True,
                            child_key,
                            move,
                        )
                    if score > alpha and score < beta and pv_node:
                        score = -self._search(
                            new_depth,
                            -beta,
                            -alpha,
                            ply + 1,
                            True,
                            True,
                            child_key,
                            move,
                        )
            finally:
                self._pop(child_key)

            if quiet:
                quiet_tried.append(move)
            if score >= beta:
                if quiet:
                    self._update_quiet_cutoff(move, quiet_tried, search_depth, ply, previous_move)
                self._store(tt_key, search_depth, beta, LOWER, move, static_eval, ply)
                return beta
            if score > alpha:
                alpha = score
                best_move = move

        flag = EXACT if alpha > original_alpha else UPPER
        self._store(tt_key, search_depth, alpha, flag, best_move, static_eval, ply)
        return alpha

    def _root_search(self, depth: int, alpha: int, beta: int) -> tuple[int, chess.Move]:
        root_tt_key = _tt_key(self.board, self.root_key)
        entry = self._probe(root_tt_key)
        tt_move = entry.move if entry is not None else self.root_best
        legal = list(self.board.legal_moves)
        if not legal:
            raise ValueError("no legal moves")
        ordered = self._ordered_moves(legal, tt_move, 0, None)
        best_move = ordered[0]
        best_score = -INF
        local_alpha = alpha
        for index, move in enumerate(ordered):
            child_key = self._push(move)
            try:
                if index == 0:
                    score = -self._search(
                        depth - 1,
                        -beta,
                        -local_alpha,
                        1,
                        True,
                        True,
                        child_key,
                        move,
                    )
                else:
                    score = -self._search(
                        depth - 1,
                        -local_alpha - 1,
                        -local_alpha,
                        1,
                        False,
                        True,
                        child_key,
                        move,
                    )
                    if score > local_alpha and score < beta:
                        score = -self._search(
                            depth - 1,
                            -beta,
                            -local_alpha,
                            1,
                            True,
                            True,
                            child_key,
                            move,
                        )
            finally:
                self._pop(child_key)
            if score > best_score:
                best_score = score
                best_move = move
            if score > local_alpha:
                local_alpha = score
                if local_alpha >= beta:
                    break
        self.root_best = best_move
        self.root_score = best_score
        return best_score, best_move

    def iterative_deepening(self, fallback: chess.Move) -> chess.Move:
        best_move = fallback
        best_score = 0
        completed_depth = 0
        for depth in range(1, 64):
            if time.perf_counter_ns() >= self.deadline_ns:
                break
            try:
                if depth >= 4 and completed_depth > 0 and abs(best_score) < MATE_TT_THRESHOLD:
                    window = 40
                    alpha = best_score - window
                    beta = best_score + window
                    while True:
                        score, move = self._root_search(depth, alpha, beta)
                        if score <= alpha:
                            alpha = max(-INF, alpha - window)
                            window *= 2
                            continue
                        if score >= beta:
                            beta = min(INF, beta + window)
                            window *= 2
                            continue
                        break
                else:
                    score, move = self._root_search(depth, -INF, INF)
            except _SearchTimeout:
                break
            best_move = move
            best_score = score
            completed_depth = depth
            if abs(best_score) >= MATE - 2 * MAX_PLY:
                break
        return best_move


def _allocate_time_ms(time_left_ms: int) -> int:
    remaining = max(1, time_left_ms)
    if remaining <= 80:
        return max(1, remaining // 8)
    reserve = max(20, min(1800, remaining // 16))
    base = remaining // 30 + 450
    if remaining < 3000:
        base = min(base, max(8, remaining * 12 // 100))
    hard_cap = max(5, remaining - reserve)
    return max(5, min(base, hard_cap, remaining // 4))


def get_move(fen: str, time_left_ms: int) -> str:
    global _LAST_ROOT_PLY, _TT_AGE
    started = time.perf_counter_ns()
    board = chess.Board(fen)
    root_ply = (board.fullmove_number - 1) * 2 + (0 if board.turn == chess.WHITE else 1)
    if _LAST_ROOT_PLY is not None and root_ply <= _LAST_ROOT_PLY:
        _GAME_KEYS.clear()
    _LAST_ROOT_PLY = root_ply
    legal = list(board.legal_moves)
    if not legal:
        return "0000"
    if len(legal) == 1:
        return legal[0].uci()

    root_key = _position_key(board)
    if not _GAME_KEYS or _GAME_KEYS[-1] != root_key:
        _GAME_KEYS.append(root_key)

    _TT_AGE = (_TT_AGE + 1) & 0x7FFFFFFF
    budget_ms = _allocate_time_ms(time_left_ms)
    safety = 0.78 if budget_ms <= 25 else 0.90
    deadline = started + int(budget_ms * safety * 1_000_000)
    searcher = _Searcher(board, deadline, root_key)

    fallback = legal[0]
    if budget_ms >= 8:
        try:
            fallback = searcher._ordered_moves(legal, None, 0, None)[0]
        except _SearchTimeout:
            fallback = legal[0]
    best = searcher.iterative_deepening(fallback) if budget_ms >= 12 else fallback

    board.push(best)
    child_key = _position_key(board)
    board.pop()
    if not _GAME_KEYS or _GAME_KEYS[-1] != child_key:
        _GAME_KEYS.append(child_key)
    return best.uci()
